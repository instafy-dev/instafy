[package]
name = "runtime-controller"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "runtime-controller"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json", "http1", "ws"] }
futures-util = "0.3"
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
runtime-contracts = { path = "../runtime-contracts" }
prost-types = "0.13"
prost = "0.13"
bb8 = "0.8"
bb8-postgres = "0.8"
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1", "with-chrono-0_4"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
subtle = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.11", features = ["json", "blocking", "multipart", "stream"] }
# The same `url` reqwest re-exports; named directly for `url::Host`.
url = "2"
urlencoding = "2"
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.21"
mime_guess = "2"
tower-http = { version = "0.5", features = ["cors"] }
notify = "6.1"
once_cell = "1.21.3"
async-trait = "0.1"
rand = "0.8"
redis = { version = "1", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
ring = { version = "0.17", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
zip = { version = "1", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
tower = "0.5"
httpmock = "0.7"
# Paused-clock tests prove the minute-scale provider deadlines without waiting.
tokio = { version = "1", features = ["test-util"] }
