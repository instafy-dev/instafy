launch=gpgsql
gpgsql-host=postgres
gpgsql-port=5432
gpgsql-dbname=tunnel_broker
gpgsql-user=tunnel_broker
gpgsql-password=password
gpgsql-dnssec=no
# The broker bootstraps the zone directly in Postgres. PowerDNS otherwise
# caches the zone list for 300 seconds, so a fast parallel startup can cache
# the database before the broker commits rt.test and serve empty answers.
zone-cache-refresh-interval=0
local-address=0.0.0.0
local-port=53
disable-axfr=yes
setuid=pdns
setgid=pdns
loglevel=4
version-string=anonymous
guardian=yes
webserver=yes
api=yes
api-key=dev-pdns-key
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0,::/0
