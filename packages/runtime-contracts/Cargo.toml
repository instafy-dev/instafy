[package]
name = "runtime-contracts"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "runtime_contracts"
path = "src/lib.rs"

[dependencies]
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
