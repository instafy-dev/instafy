[package]
name = "git-service"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "git-edge"
path = "src/bin/git-edge.rs"
required-features = ["server"]

[[bin]]
name = "git-shard"
path = "src/bin/git-shard.rs"
required-features = ["server"]

[features]
default = ["server"]
# The git-edge and git-shard services. Without it the crate is only the
# repository push policy (`policy`), which origin-http-server shares.
server = [
  "dep:aws-lc-rs",
  "dep:axum",
  "dep:base64",
  "dep:bytes",
  "dep:futures-util",
  "dep:jsonwebtoken",
  "dep:reqwest",
  "dep:runtime-contracts",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:tokio",
  "dep:tokio-stream",
  "dep:tokio-util",
  "dep:tower",
  "dep:tower-http",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:uuid",
]

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json", "http1", "tokio", "macros"], optional = true }
base64 = { version = "0.21", optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
# Only the aws_lc_rs backend may be on: with rust_crypto as well it still
# builds, but every sign and verify panics.
jsonwebtoken = { version = "10.4", default-features = false, features = ["use_pem", "aws_lc_rs"], optional = true }
reqwest = { version = "0.11", features = ["json", "stream"], optional = true }
runtime-contracts = { path = "../runtime-contracts", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "process", "io-util", "fs", "time"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[target.'cfg(windows)'.dependencies]
# jsonwebtoken's aws-lc backend needs NASM to build on x86_64 Windows unless
# its prebuilt objects are allowed. runtime-agent gets this through rustls.
aws-lc-rs = { version = "1.18", features = ["prebuilt-nasm"], optional = true }

[dev-dependencies]
# Throwaway Ed25519 keys for the JWKS test, which exists only with `server`,
# where jsonwebtoken already links it as its crypto backend.
aws-lc-rs = "1.18"

[target.'cfg(windows)'.dev-dependencies]
# Test builds without `server` still build it, so they need the prebuilt
# NASM objects on x86_64 Windows too.
aws-lc-rs = { version = "1.18", features = ["prebuilt-nasm"] }
