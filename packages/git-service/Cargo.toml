[package]
name = "git-service"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "git-edge"
path = "src/bin/git-edge.rs"

[[bin]]
name = "git-shard"
path = "src/bin/git-shard.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json", "http1", "tokio", "macros"] }
base64 = "0.21"
bytes = "1"
futures-util = "0.3"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
runtime-contracts = { path = "../runtime-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "process", "io-util", "fs", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
