<!doctype html>
<!-- A sign-in page on a separate account host, like a hosted identity realm. Synthetic. -->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anmelden</title>
  </head>
  <body>
    <h1>Bei Ihrem Konto anmelden</h1>
    <form method="post" action="./index.html">
      <label>Benutzername oder E-Mail <input name="username" autocomplete="username" /></label>
      <label>Passwort <input type="password" name="password" autocomplete="current-password" /></label>
      <button type="submit">Anmelden</button>
    </form>
    <button type="button">Mit Google anmelden</button>
    <a href="./passwort-vergessen.html">Passwort vergessen?</a>
  </body>
</html>
