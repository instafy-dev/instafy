[package]
name = "runtime-provider-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.21"
bb8 = "0.8"
bb8-postgres = "0.8"
jsonwebtoken = "9"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1", "with-chrono-0_4"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
