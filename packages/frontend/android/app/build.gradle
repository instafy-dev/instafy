apply plugin: 'com.android.application'

def envOrNull = { String name ->
    def value = System.getenv(name)
    if (value == null) {
        return null
    }
    def trimmed = value.trim()
    return trimmed ? trimmed : null
}

def uploadStoreFile = envOrNull("ANDROID_UPLOAD_STORE_FILE")
def uploadStoreType = envOrNull("ANDROID_UPLOAD_STORE_TYPE")
def uploadStorePassword = envOrNull("ANDROID_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = envOrNull("ANDROID_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = envOrNull("ANDROID_UPLOAD_KEY_PASSWORD")
def versionCodeOverride = envOrNull("ANDROID_VERSION_CODE")
def versionNameOverride = envOrNull("ANDROID_VERSION_NAME")

def resolvedVersionCode = 1
if (versionCodeOverride != null) {
    try {
        resolvedVersionCode = Integer.parseInt(versionCodeOverride)
    } catch (NumberFormatException error) {
        throw new GradleException("ANDROID_VERSION_CODE must be an integer, got '${versionCodeOverride}'.", error)
    }
}

def resolvedVersionName = versionNameOverride ?: "1.0"

android {
    namespace = "dev.instafy.studio"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        if (uploadStoreFile && uploadStorePassword && uploadKeyAlias && uploadKeyPassword) {
            release {
                storeFile file(uploadStoreFile)
                if (uploadStoreType != null) {
                    storeType uploadStoreType
                }
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId "dev.instafy.studio"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (android.signingConfigs.findByName('release') != null) {
                signingConfig android.signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
