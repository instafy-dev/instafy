<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Instafy</title>
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var mode = (params.get("mode") || "").trim().toLowerCase();
          var isExtensionMode = mode.indexOf("extension") === 0;
          var resolvedTheme = null;

          if (isExtensionMode) {
            var override = (params.get("theme") || "").trim().toLowerCase();
            if (override === "dark" || override === "light") {
              resolvedTheme = override;
            }
          }

          if (!resolvedTheme) {
            var raw = "";
            try {
              raw = window.localStorage ? window.localStorage.getItem("instafy.themeMode") || "" : "";
            } catch (err) {
              raw = "";
            }

            var stored = raw.trim().toLowerCase();
            if (stored === "dark" || stored === "light") {
              resolvedTheme = stored;
            } else {
              resolvedTheme =
                window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light";
            }
          }

          if (resolvedTheme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch (err) {
          // ignore early theme failures
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Instafy is a chat-first AI workspace with real files, Monaco editing, and runtime control, so you can build, edit, and run code without losing control."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Instafy" />
    <meta
      property="og:description"
      content="Instafy is a chat-first AI workspace with real files, Monaco editing, and runtime control, so you can build, edit, and run code without losing control."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Instafy" />
    <meta
      name="twitter:description"
      content="Instafy is a chat-first AI workspace with real files, Monaco editing, and runtime control, so you can build, edit, and run code without losing control."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=3" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
