[package]
name = "origin-http-server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json", "http1", "tokio", "macros", "multipart", "ws"] }
base64 = "0.21"
cap-fs-ext = { version = "=4.0.2", default-features = false, features = ["std"] }
cap-std = { version = "=4.0.2", default-features = false }
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = "0.3"
fs2 = "0.4"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
once_cell = "1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
unicode-normalization = "0.1"
zip = { version = "1", default-features = false, features = ["deflate"] }
tempfile = "3"
tokio-stream = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"

[dev-dependencies]
ring = { version = "0.17", features = ["std"] }
