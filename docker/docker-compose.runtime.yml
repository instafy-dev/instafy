services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"

  git-shard-0:
    build:
      context: ..
      dockerfile: docker/git-services-dev/Dockerfile
      args:
        BUILD_PROFILE: dev
        BUILD_ARTIFACT_DIR: debug
        CARGO_PROFILE_DEV_DEBUG: ${CARGO_PROFILE_DEV_DEBUG:-2}
    image: git-services:local
    entrypoint: ["/usr/local/bin/git-shard"]
    working_dir: /var/lib/instafy-git
    environment:
      RUST_LOG: info,git_service=info
      GIT_SHARD_BIND_HOST: 0.0.0.0
      GIT_SHARD_BIND_PORT: 8081
      GIT_REPO_ROOT: /var/lib/instafy-git/repos
      GIT_AUTO_INIT: ${GIT_AUTO_INIT:-1}
      GIT_DEFAULT_BRANCH: ${GIT_DEFAULT_BRANCH:-main}
      GIT_EVENTS_WEBHOOK_URL: ${GIT_EVENTS_WEBHOOK_URL:-http://host.docker.internal:8788/git/hooks/events}
      GIT_EVENTS_WEBHOOK_TOKEN: ${GIT_EVENTS_WEBHOOK_TOKEN:-dev-internal-token}
      GIT_EVENTS_WEBHOOK_TIMEOUT_MS: ${GIT_EVENTS_WEBHOOK_TIMEOUT_MS:-3000}
    volumes:
      - ${GIT_REPO_VOLUME:-../tmp/git-repos}:/var/lib/instafy-git/repos

  git-edge:
    image: git-services:local
    entrypoint: ["/usr/local/bin/git-edge"]
    environment:
      RUST_LOG: info,git_service=info
      GIT_EDGE_BIND_HOST: 0.0.0.0
      GIT_EDGE_BIND_PORT: 8080
      GIT_EDGE_SKIP_AUTH: ${GIT_EDGE_SKIP_AUTH:-0}
      GIT_EDGE_ROUTING: ${GIT_EDGE_ROUTING:-controller}
      GIT_EDGE_CONTROLLER_URL: ${GIT_EDGE_CONTROLLER_URL:-http://host.docker.internal:8788}
      GIT_EDGE_CONTROLLER_TOKEN: ${GIT_EDGE_CONTROLLER_TOKEN:-dev-internal-token}
      GIT_EDGE_ROUTE_CACHE_SECONDS: ${GIT_EDGE_ROUTE_CACHE_SECONDS:-60}
      GIT_AUDIENCE: ${GIT_AUDIENCE:-git}
      GIT_JWKS_URL: ${GIT_JWKS_URL:-http://host.docker.internal:8788/.well-known/jwks.json}
      GIT_SHARDS: ${GIT_SHARDS:-http://git-shard-0:8081}
    depends_on:
      - git-shard-0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GIT_EDGE_PORT:-8080}:8080"

  origin-gateway:
    image: git-services:local
    entrypoint: ["/usr/local/bin/origin-http-server"]
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    environment:
      RUST_LOG: info,origin_http_server=info
      ORIGIN_MULTI_TENANT: "1"
      ORIGIN_PROJECT_ID: ${ORIGIN_GATEWAY_PROJECT_ID:-00000000-0000-0000-0000-000000000000}
      ORIGIN_ID: ${ORIGIN_GATEWAY_ID:-00000000-0000-0000-0000-000000000000}
      ORIGIN_WORKSPACE_ROOT: /workspaces
      ORIGIN_BIND_HOST: 0.0.0.0
      ORIGIN_BIND_PORT: 54333
      ORIGIN_SKIP_AUTH: ${ORIGIN_GATEWAY_SKIP_AUTH:-0}
      ORIGIN_INTERNAL_TOKEN: ${ORIGIN_INTERNAL_TOKEN:-dev-internal-token}
      ORIGIN_CONTROLLER_URL: ${CONTROLLER_BASE_URL:-http://host.docker.internal:8788}
      ORIGIN_GIT_REMOTE_BASE_URL: ${ORIGIN_GIT_REMOTE_BASE_URL:-http://git-edge:8080}
      ORIGIN_GIT_BRANCH: ${ORIGIN_GIT_BRANCH:-main}
      ORIGIN_GIT_REMOTE_NAME: ${ORIGIN_GIT_REMOTE_NAME:-origin}
      ORIGIN_GIT_AUTHOR_NAME: ${ORIGIN_GIT_AUTHOR_NAME:-instafy-origin}
      ORIGIN_GIT_AUTHOR_EMAIL: ${ORIGIN_GIT_AUTHOR_EMAIL:-origin@instafy.dev}
      ORIGIN_MAX_ARCHIVE_BYTES: ${ORIGIN_MAX_ARCHIVE_BYTES:-134217728}
    volumes:
      - ${ORIGIN_GATEWAY_WORKSPACE_VOLUME:-../tmp/origin-gateway-workspaces}:/workspaces
    depends_on:
      - git-edge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ORIGIN_GATEWAY_PORT:-54333}:54333"

  proxy:
    build:
      context: ..
      dockerfile: docker/proxy/Dockerfile
      args:
        BUILD_PROFILE: dev
        BUILD_ARTIFACT_DIR: debug
    image: runtime-proxy:local
    environment:
      CODEX_PROXY_ADDR: ${CODEX_PROXY_ADDR:-0.0.0.0:8789}
      CODEX_HOME: /root/.codex
      CODEX_AUTH_PATH: /root/.codex/auth.json
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CONTROLLER_BASE_URL: ${CONTROLLER_BASE_URL:-http://host.docker.internal:8788}
      CONTROLLER_INTERNAL_TOKEN: ${CONTROLLER_INTERNAL_TOKEN:-}
      PROXY_CREDENTIAL_LEASE_TOKEN: ${PROXY_CREDENTIAL_LEASE_TOKEN:-}
      PROXY_SIGNING_SECRET: ${PROXY_SIGNING_SECRET:-}
      PROXY_CREDIT_BURN_AMOUNT: ${PROXY_CREDIT_BURN_AMOUNT:-}
    volumes:
      - ${PROXY_CODEX_VOLUME:-../tmp/proxy-codex}:/root/.codex
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROXY_PORT:-8789}:8789"

  runtime:
    build:
      context: ..
      dockerfile: docker/runtime/Dockerfile
      target: ${RUNTIME_AGENT_BUILD_TARGET:-runtime-webdev}
    image: ${RUNTIME_AGENT_IMAGE:-instafy-runtime-agent:webdev-local}
    cpus: ${RUNTIME_CPU_LIMIT:-2}
    mem_limit: ${RUNTIME_MEMORY_LIMIT:-4g}
    cap_drop:
      - SYS_PTRACE
    env_file:
      - ${INSTAFY_ENV_DIR:-..}/docker/.env.local
    environment:
      RUNTIME_TYPE: ${RUNTIME_TYPE:-codex-embedded}
      RUNTIME_ID: ${RUNTIME_ID:-}
      RUNTIME_LEASE_ID: ${RUNTIME_LEASE_ID:-}
      RUNTIME_LEASE_SECONDS: ${RUNTIME_LEASE_SECONDS:-300}
      RUNTIME_HEARTBEAT_SECONDS: ${RUNTIME_HEARTBEAT_SECONDS:-120}
      WORKSPACE_DIR: /workspace
      CODEX_HOME: /workspace/.codex
      INSTAFY_ENABLE_BROWSER_SESSION: ${INSTAFY_ENABLE_BROWSER_SESSION:-0}
      INSTAFY_BROWSER_EGRESS_ISOLATION: ${INSTAFY_BROWSER_EGRESS_ISOLATION:-1}
      INSTAFY_BROWSER_EGRESS_ALLOW_UNSAFE_DEV: ${INSTAFY_BROWSER_EGRESS_ALLOW_UNSAFE_DEV:-0}
      INSTAFY_BROWSER_EGRESS_PROXY_BIND: ${INSTAFY_BROWSER_EGRESS_PROXY_BIND:-127.0.0.1:9226}
      INSTAFY_BROWSER_EGRESS_ALLOWED_PORTS: ${INSTAFY_BROWSER_EGRESS_ALLOWED_PORTS:-80,443}
      INSTAFY_BROWSER_EGRESS_MAX_CONNECTIONS: ${INSTAFY_BROWSER_EGRESS_MAX_CONNECTIONS:-128}
      INSTAFY_BROWSER_VIEWPORT_ONLY: ${INSTAFY_BROWSER_VIEWPORT_ONLY:-0}
      INSTAFY_BROWSER_PROFILE_PERSIST: ${INSTAFY_BROWSER_PROFILE_PERSIST:-0}
      INSTAFY_BROWSER_PROFILE_SNAPSHOT_SECS: ${INSTAFY_BROWSER_PROFILE_SNAPSHOT_SECS:-30}
      INSTAFY_BROWSER_RENDER_SCALE: ${INSTAFY_BROWSER_RENDER_SCALE:-1}
      INSTAFY_BROWSER_MAX_FRAMEBUFFER_PIXELS: ${INSTAFY_BROWSER_MAX_FRAMEBUFFER_PIXELS:-8294400}
      INSTAFY_BROWSER_CDP_SCREENCAST: ${INSTAFY_BROWSER_CDP_SCREENCAST:-0}
      INSTAFY_BROWSER_WEBRTC_ENABLED: ${INSTAFY_BROWSER_WEBRTC_ENABLED:-0}
      INSTAFY_BROWSER_PREFERRED_VIEWER: ${INSTAFY_BROWSER_PREFERRED_VIEWER:-}
      INSTAFY_BROWSER_WEBRTC_ICE_SERVERS_JSON: ${INSTAFY_BROWSER_WEBRTC_ICE_SERVERS_JSON:-}
      INSTAFY_BROWSER_WEBRTC_REQUIRE_TURN: ${INSTAFY_BROWSER_WEBRTC_REQUIRE_TURN:-0}
      INSTAFY_BROWSER_WEBRTC_FPS: ${INSTAFY_BROWSER_WEBRTC_FPS:-30}
      INSTAFY_BROWSER_WEBRTC_BITRATE_KBPS: ${INSTAFY_BROWSER_WEBRTC_BITRATE_KBPS:-3500}
      INSTAFY_BROWSER_DISPLAY: ${INSTAFY_BROWSER_DISPLAY:-}
      INSTAFY_VNC_HOST: ${INSTAFY_VNC_HOST:-}
      INSTAFY_VNC_PORT: ${INSTAFY_VNC_PORT:-}
      INSTAFY_VNC_GEOMETRY: ${INSTAFY_VNC_GEOMETRY:-}
      INSTAFY_VNC_DEPTH: ${INSTAFY_VNC_DEPTH:-}
      INSTAFY_PLAYWRIGHT_MCP_MODE: ${INSTAFY_PLAYWRIGHT_MCP_MODE:-}
      INSTAFY_PLAYWRIGHT_MCP_PORT: ${INSTAFY_PLAYWRIGHT_MCP_PORT:-}
      INSTAFY_PLAYWRIGHT_MCP_PROFILE_DIR: ${INSTAFY_PLAYWRIGHT_MCP_PROFILE_DIR:-}
      INSTAFY_PLAYWRIGHT_MCP_ALLOW_ISOLATED: ${INSTAFY_PLAYWRIGHT_MCP_ALLOW_ISOLATED:-}
      CONTROLLER_BASE_URL: ${CONTROLLER_BASE_URL:-http://host.docker.internal:8788}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SPACE_ID: ${SPACE_ID:-00000000-0000-0000-0000-000000000000}
      PROJECT_ID: ${SPACE_ID:-00000000-0000-0000-0000-000000000000}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://proxy:8789/v1}
      CODEX_PROXY_CHATGPT_ENDPOINT: ${CODEX_PROXY_CHATGPT_ENDPOINT:-http://proxy:8789/backend-api/codex/responses}
      RUNTIME_VERSION: ${RUNTIME_VERSION:-local-runtime}
      RUNTIME_CAPABILITIES: ${RUNTIME_CAPABILITIES:-}
      RUNTIME_METADATA: ${RUNTIME_METADATA:-}
      PROXY_BASE_URL: ${PROXY_BASE_URL:-http://proxy:8789}
      CODEX_CHATGPT_ENDPOINT: ${CODEX_CHATGPT_ENDPOINT:-http://proxy:8789/backend-api/codex/responses}
      # `.env.local` contains the proxy's signing key in the local harness.
      # Empty overrides prevent broad env_file inheritance from exposing
      # proxy/origin bearer credentials inside the runtime service.
      PROXY_SIGNING_SECRET: ""
      ORIGIN_ACCESS_TOKEN: ""
      PROXY_TOKEN_TTL_SECONDS: ${PROXY_TOKEN_TTL_SECONDS:-1800}
      CODEX_API_ENDPOINT: ${CODEX_API_ENDPOINT:-http://proxy:8789/api}
      CODEX_API_KEY: ${CODEX_API_KEY:-proxy-dev-key}
      CODEX_MODEL: ${CODEX_MODEL:-}
      CODEX_MODEL_PROVIDER: ${CODEX_MODEL_PROVIDER:-}
      CODEX_PROFILE: ${CODEX_PROFILE:-}
      CODEX_SANDBOX_MODE: ${CODEX_SANDBOX_MODE:-danger-full-access}
      CODEX_BASE_INSTRUCTIONS: ${CODEX_BASE_INSTRUCTIONS:-}
      CODEX_INCLUDE_PLAN_TOOL: ${CODEX_INCLUDE_PLAN_TOOL:-true}
      CODEX_INCLUDE_APPLY_PATCH_TOOL: ${CODEX_INCLUDE_APPLY_PATCH_TOOL:-true}
      CODEX_INCLUDE_VIEW_IMAGE_TOOL: ${CODEX_INCLUDE_VIEW_IMAGE_TOOL:-true}
      CODEX_SHOW_RAW_AGENT_REASONING: ${CODEX_SHOW_RAW_AGENT_REASONING:-}
      CODEX_ENABLE_WEB_SEARCH: ${CODEX_ENABLE_WEB_SEARCH:-}
      CODEX_DISABLED: ${CODEX_DISABLED:-0}
      CODEX_AUTH_PATH: ${CODEX_AUTH_PATH:-/workspace/.codex/auth.json}
      USE_PROXY_FOR_LLM: ${USE_PROXY_FOR_LLM:-1}
      RUNTIME_STRICT_MODE: ${RUNTIME_STRICT_MODE:-0}
      RUNTIME_DEV_ISOLATION: ${RUNTIME_DEV_ISOLATION:-0}
      RUNTIME_ACCESS_TOKEN: ${RUNTIME_ACCESS_TOKEN:-}
      # A controller credential-lease bearer belongs only in the proxy.
      # Override any value inherited from .env.local so the agent cannot read it.
      PROXY_CREDENTIAL_LEASE_TOKEN: ""
      ORIGIN_ID: ${ORIGIN_ID:-}
      ORIGIN_BIND_HOST: ${ORIGIN_BIND_HOST:-0.0.0.0}
      ORIGIN_BIND_PORT: ${ORIGIN_BIND_PORT:-54332}
      ORIGIN_ENDPOINT: ${ORIGIN_ENDPOINT:-http://host.docker.internal:54332}
      ORIGIN_SKIP_AUTH: ${ORIGIN_SKIP_AUTH:-0}
      ORIGIN_ENABLE_PRESENCE_HEARTBEAT: ${ORIGIN_ENABLE_PRESENCE_HEARTBEAT:-1}
      ORIGIN_INTERNAL_TOKEN: ${ORIGIN_INTERNAL_TOKEN:-dev-internal-token}
      ORIGIN_GIT_REMOTE_URL: ${ORIGIN_GIT_REMOTE_URL:-}
      ORIGIN_GIT_BRANCH: ${ORIGIN_GIT_BRANCH:-main}
      ORIGIN_GIT_REMOTE_NAME: ${ORIGIN_GIT_REMOTE_NAME:-origin}
      ORIGIN_GIT_AUTHOR_NAME: ${ORIGIN_GIT_AUTHOR_NAME:-instafy-origin}
      ORIGIN_GIT_AUTHOR_EMAIL: ${ORIGIN_GIT_AUTHOR_EMAIL:-origin@instafy.dev}
      ORIGIN_PROTOCOLS: ${ORIGIN_PROTOCOLS:-http}
      ORIGIN_MODE: ${ORIGIN_MODE:-desktop}
      # Docker allocator runtimes run co-located with the controller, so we can reach the origin
      # HTTP server via the published host port. Disable tunnels by default to reduce moving parts.
      ORIGIN_TUNNEL_ENABLED: ${ORIGIN_TUNNEL_ENABLED:-0}
      ORIGIN_DEVICE_ID: ${ORIGIN_DEVICE_ID:-runtime-desktop}
      ORIGIN_LEASE_ID: ${ORIGIN_LEASE_ID:-}
      ORIGIN_METADATA: ${ORIGIN_METADATA:-}
    volumes:
      - ${RUNTIME_REPO_HOST:-../..}:/workspace/${SPACE_ID:-00000000-0000-0000-0000-000000000000}
      - ${RUNTIME_CODEX_VOLUME:-./.codex}:/workspace/.codex
    depends_on:
      - proxy
    working_dir: /workspace
    tty: true
    stdin_open: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ORIGIN_HOST_PORT:-54332}:54332"
