<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>Your sign-in code</title>
  </head>
  <body data-instafy-email="magic_link" style="margin: 0; padding: 0; background-color: #ffffff; font-family: Arial, Helvetica, sans-serif; color: #0f172a;">
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all; font-size: 1px; line-height: 1px; opacity: 0;">Your verification code is {{ .Token }}.</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#ffffff">
      <tr>
        <td align="center" style="padding: 40px 24px;">
          <!--[if mso]><table role="presentation" width="480" cellspacing="0" cellpadding="0"><tr><td><![endif]-->
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 480px;">
            <tr>
              <td style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 24px; text-align: left; color: #0f172a;">
                <p style="margin: 0 0 32px; font-size: 16px; font-weight: 700;">Instafy</p>
                <h1 style="margin: 0 0 16px; font-size: 24px; line-height: 32px; font-weight: 700;">Your sign-in code</h1>
                <p style="margin: 0; color: #475569;">Enter this verification code in Instafy to sign in.</p>
                <p style="margin: 28px 0; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: 4px; color: #0f172a;">{{ .Token }}</p>
                <p style="margin: 32px 0 0; font-size: 14px; line-height: 22px; color: #64748b;">If you didn&rsquo;t try to sign in, you can ignore this email.</p>
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
