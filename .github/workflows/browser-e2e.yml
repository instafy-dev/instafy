          sudo ln -sf "$chromium_path" /usr/bin/chromium
      - name: Install fixture display, database and compiler prerequisites
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo -n apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends x11-utils sqlite3 postgresql-client build-essential pkg-config libssl-dev clang lld cmake libcap-dev protobuf-compiler
          for package in x11-utils sqlite3 postgresql-client build-essential pkg-config libssl-dev clang lld cmake libcap-dev protobuf-compiler; do
            [[ "$(dpkg-query --show --showformat='${Status}' "$package")" == 'install ok installed' ]]
          done
          pkg-config --exists libcap openssl
      - name: Restore Supabase Postgres image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.instafy-image-cache
          key: shared-browser-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test-supabase-migrations-empty-db.mjs') }}
      - name: Restore compiler cache without saving
        if: runner.environment == 'self-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          key: shared-browser-cargo-v1-${{ runner.os }}-${{ runner.arch }}-public-shared-browser-studio-${{ hashFiles('packages/*/Cargo.lock') }}

      - name: Restore architecture-specific compiler cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          key: shared-browser-cargo-v1-${{ runner.os }}-${{ runner.arch }}-public-shared-browser-studio-${{ hashFiles('packages/*/Cargo.lock') }}
      - name: Start disposable migrated Supabase and local authentication
        env:
          SUPABASE_BROWSER_TEST: "1"
        run: |
          node scripts/ensure-supabase-postgres-image.mjs
          pnpm supabase:up
      - name: Test fixture safety guards
        run: node --test scripts/browser-profile-e2e.test.mjs scripts/shared-browser-studio-e2e.test.mjs scripts/lib/sharedStudioProvider.test.mjs scripts/check-shared-browser-ci.test.mjs
      - name: Exercise signed-in Studio launch, input, snapshot restore and clear
        env:
          INSTAFY_SHARED_BROWSER_COMPILER_PROXY: ${{ runner.environment == 'self-hosted' && '1' || '0' }}
        run: xvfb-run -a node scripts/shared-browser-studio-e2e.mjs
      - name: Retain only credential-free browser results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-studio
          path: |
            packages/frontend/test-results/browser-ci/shared-studio/result.json
            packages/frontend/test-results/browser-ci/shared-studio/required-browser-result.json
          if-no-files-found: error
          retention-days: 7
      - name: Stop the disposable authentication stack
        if: always()
        run: pnpm supabase:down
