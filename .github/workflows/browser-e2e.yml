name: Browser verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  personal:
    name: Personal Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser and display dependencies
        run: pnpm --filter @instafy/frontend exec playwright install --with-deps chromium
      - name: Build the native fixture app
        run: |
          pnpm --filter @instafy/desktop-runtime-agent build
          pnpm --filter @instafy/desktop-app exec tsup
      - name: Prove the test gate rejects skipped and missing cases
        run: |
          node --test scripts/browser-ci.test.mjs scripts/required-browser-reporter.test.mjs scripts/required-browser-reporter.integration.test.mjs scripts/browser-ci-workflow.test.mjs
      - name: Run real Personal Browser cookie and ownership E2E
        run: xvfb-run -a pnpm test:browser:ci personal
      - name: Retain fixture-only results and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: personal-browser-e2e
          path: packages/frontend/test-results/browser-ci/personal
          if-no-files-found: error
          retention-days: 7

  browser-ui:
    name: Browser UI rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install locked Chromium and operating-system dependencies
        run: pnpm --filter @instafy/frontend exec playwright install --with-deps chromium
      - name: Run browser component rendering proofs
        run: pnpm test:browser:ci browser-ui
      - name: Retain fixture-only results and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-ui-rendering
          path: packages/frontend/test-results/browser-ci/browser-ui
          if-no-files-found: error
          retention-days: 7

  shared-profile:
    name: Shared Browser profile E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Free space on the disposable hosted runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install locked Chromium and operating-system dependencies
        run: pnpm --filter @instafy/frontend exec playwright install --with-deps chromium
      - name: Bind the launcher to the locked test Chromium
        working-directory: packages/frontend
        run: |
          chromium_path="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          test -x "$chromium_path"
          # This path is confined to a fresh GitHub-hosted runner; it is never
          # installed or changed by the local test script on a user's machine.
          sudo ln -sf "$chromium_path" /usr/bin/chromium
      - name: Restore Supabase Postgres image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.instafy-image-cache
          key: supabase-postgres-image-${{ hashFiles('scripts/test-supabase-migrations-empty-db.mjs') }}
      - name: Start disposable migrated Postgres
        env:
          SUPABASE_DATABASE_ONLY: "1"
        run: |
          node scripts/ensure-supabase-postgres-image.mjs
          pnpm supabase:up
      - name: Test fixture safety guards
        run: node --test scripts/browser-profile-e2e.test.mjs
      - name: Exercise real Chromium and controller profile lifecycle
        run: xvfb-run -a node scripts/browser-profile-e2e.mjs
      - name: Retain the credential-free profile result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-browser-profile-e2e
          path: packages/frontend/test-results/browser-ci/shared-profile/result.json
          if-no-files-found: error
          retention-days: 7
