               && github.event.pull_request.base.ref == 'main'
               && github.event.pull_request.base.repo.full_name == github.repository
               && github.event.pull_request.head.repo.full_name == github.repository
               && github.event.pull_request.head.repo.fork == false)
              || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true))
          && fromJSON(format('{{"group":"org/instafy-ci-{3}","labels":["self-hosted","Linux","ARM64","instafy-ci-bootstrap-{0}-{1}-{2}-public-shared-browser-studio","instafy-ci-trust-{3}"]}}', github.repository_id, github.run_id, github.run_attempt, github.event_name == 'push' && 'main' || 'pr'))
          || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Qualify isolated Shared Browser CI runner
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          assert.ok(Number.isSafeInteger(process.getuid()) && process.getuid() > 0);
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(process.env.RUNNER_OS, 'Linux');
          assert.equal(process.env.RUNNER_ARCH, 'ARM64');
          assert.equal(process.env.INSTAFY_CI_JOB_ISOLATION, 'ephemeral');
          assert.ok(!process.env.INSTAFY_ENV_DIR);
          for (const tool of ['bash', 'git', 'curl', 'tar', 'unzip', 'sudo', 'apt-get', 'xvfb-run', 'Xvfb', 'xauth', 'docker', 'cargo', 'rustc', 'rustup', 'cc', 'pkg-config']) {
            execFileSync('/bin/bash', ['-c', 'command -v "$1" >/dev/null', 'browser-ci-preflight', tool], { timeout: 1000, stdio: 'ignore' });
          }
          const daemon = JSON.parse(execFileSync('docker', ['info', '--format', '{{json .}}'], { timeout: 5000, encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }));
          assert.equal(daemon.OSType, 'linux');
          assert.ok(['aarch64', 'arm64'].includes(daemon.Architecture));
          NODE
      - name: Checkout the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Free space on the disposable hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install locked Chromium and operating-system dependencies
        run: pnpm --filter @instafy/frontend exec playwright install --with-deps chromium
      - name: Bind the launcher to the locked test Chromium
        working-directory: packages/frontend
        run: |
          chromium_path="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          test -x "$chromium_path"
          # This path is confined to a disposable CI runner; it is never
