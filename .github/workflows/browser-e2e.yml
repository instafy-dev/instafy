name: Browser verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  personal:
    name: Personal Browser E2E
    runs-on: >-
      ${{ fromJSON(
        vars.CI_RUNNER_MODE == 'self-hosted' && (
          (github.ref == 'refs/heads/main' &&
           (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
          (vars.CI_TRUSTED_PR_SELF_HOSTED == 'true' && github.event.repository.private == true &&
           github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        ) &&
        (github.event_name == 'pull_request' && '{"group":"org/instafy-ci-pr","labels":["self-hosted","Linux","ARM64","instafy-ci-linux-arm64","instafy-ci-trust-pr"]}' || '{"group":"org/instafy-ci-main","labels":["self-hosted","Linux","ARM64","instafy-ci-linux-arm64","instafy-ci-trust-main"]}') || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser and display dependencies
        run: pnpm --filter @instafy/frontend exec playwright install --with-deps chromium
      - name: Build the native fixture app
        run: |
          pnpm --filter @instafy/desktop-runtime-agent build
          pnpm --filter @instafy/desktop-app exec tsup
      - name: Prove the test gate rejects skipped and missing cases
        run: |
          node --test scripts/browser-ci.test.mjs scripts/required-browser-reporter.test.mjs scripts/required-browser-reporter.integration.test.mjs scripts/browser-ci-workflow.test.mjs
      - name: Run real Personal Browser cookie and ownership E2E
        run: xvfb-run -a pnpm test:browser:ci personal
      - name: Retain fixture-only results and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: personal-browser-e2e
          path: packages/frontend/test-results/browser-ci/personal
          if-no-files-found: error
          retention-days: 7

  browser-ui:
    name: Browser UI rendering
    runs-on: >-
      ${{ fromJSON(
        vars.CI_RUNNER_MODE == 'self-hosted' && (
          (github.ref == 'refs/heads/main' &&
           (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
          (vars.CI_TRUSTED_PR_SELF_HOSTED == 'true' && github.event.repository.private == true &&
           github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        ) &&
        (github.event_name == 'pull_request' && '{"group":"org/instafy-ci-pr","labels":["self-hosted","Linux","ARM64","instafy-ci-linux-arm64","instafy-ci-trust-pr"]}' || '{"group":"org/instafy-ci-main","labels":["self-hosted","Linux","ARM64","instafy-ci-linux-arm64","instafy-ci-trust-main"]}') || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install locked Chromium and operating-system dependencies
        run: pnpm --filter @instafy/frontend exec playwright install --with-deps chromium
      - name: Prove isolated co-browsing fixture boundaries
        run: node --test scripts/shared-browser-cobrowsing-e2e.test.mjs
      - name: Exercise routine approval and human-input handoff in real Chromium
        run: node scripts/shared-browser-cobrowsing-e2e.mjs
      - name: Run browser component rendering proofs
        run: pnpm test:browser:ci browser-ui
      - name: Retain fixture-only results and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-ui-rendering
          path: |
            packages/frontend/test-results/browser-ci/browser-ui
            packages/frontend/test-results/browser-ci/shared-cobrowsing
          if-no-files-found: error
          retention-days: 7

  shared-profile:
    name: Shared Browser profile E2E
    runs-on: >-
      ${{ fromJSON(
        vars.CI_RUNNER_MODE == 'self-hosted' && (
          (github.ref == 'refs/heads/main' &&
           (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
          (vars.CI_TRUSTED_PR_SELF_HOSTED == 'true' && github.event.repository.private == true &&
           github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        ) &&
        (github.event_name == 'pull_request' && '{"group":"org/instafy-ci-pr","labels":["self-hosted","Linux","ARM64","instafy-ci-linux-arm64","instafy-ci-trust-pr"]}' || '{"group":"org/instafy-ci-main","labels":["self-hosted","Linux","ARM64","instafy-ci-linux-arm64","instafy-ci-trust-main"]}') || '["ubuntu-24.04"]') }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Free space on the disposable hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install locked Chromium and operating-system dependencies
        run: pnpm --filter @instafy/frontend exec playwright install --with-deps chromium
      - name: Bind the launcher to the locked test Chromium
        working-directory: packages/frontend
        run: |
          chromium_path="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          test -x "$chromium_path"
          # Both runner modes require a fresh disposable Linux guest. This is
          # never installed by the local test script on a user's machine.
          sudo ln -sf "$chromium_path" /usr/bin/chromium
      - name: Install fixture display and database probes
        run: sudo apt-get update && sudo apt-get install -y x11-utils sqlite3 postgresql-client
      - name: Restore Supabase Postgres image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.instafy-image-cache
          key: supabase-postgres-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test-supabase-migrations-empty-db.mjs') }}
      - name: Start disposable migrated Supabase and local authentication
        run: |
          node scripts/ensure-supabase-postgres-image.mjs
          pnpm supabase:up
      - name: Test fixture safety guards
        run: node --test scripts/browser-profile-e2e.test.mjs scripts/shared-browser-studio-e2e.test.mjs scripts/lib/sharedStudioProvider.test.mjs
      - name: Exercise real Chromium and controller profile lifecycle
        run: xvfb-run -a node scripts/browser-profile-e2e.mjs
      - name: Exercise signed-in Studio launch, input, snapshot restore and clear
        run: xvfb-run -a node scripts/shared-browser-studio-e2e.mjs
      - name: Retain only credential-free browser results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-browser-profile-e2e
          path: |
            packages/frontend/test-results/browser-ci/shared-profile/result.json
            packages/frontend/test-results/browser-ci/shared-studio/result.json
            packages/frontend/test-results/browser-ci/shared-studio/required-browser-result.json
          if-no-files-found: error
          retention-days: 7
      - name: Stop the disposable authentication stack
        if: always()
        run: pnpm supabase:down
