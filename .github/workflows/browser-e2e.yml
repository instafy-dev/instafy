name: Browser verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  personal:
    name: Personal Browser E2E
    runs-on: >-
      ${{ vars.CI_BROWSER_SELF_HOSTED == 'true'
          && github.repository == 'instafy-dev/instafy'
          && github.event.repository.private == true
          && github.workflow_ref == format('instafy-dev/instafy/.github/workflows/build.yml@{0}', github.ref)
          && ((github.event_name == 'pull_request'
               && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number)
               && github.event.pull_request.base.ref == 'main'
               && github.event.pull_request.base.repo.full_name == github.repository
               && github.event.pull_request.head.repo.full_name == github.repository
               && github.event.pull_request.head.repo.fork == false)
              || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true))
          && fromJSON(format('{{"group":"org/instafy-ci-{3}","labels":["self-hosted","Linux","ARM64","instafy-ci-bootstrap-{0}-{1}-{2}-public-browser-personal","instafy-ci-trust-{3}"]}}', github.repository_id, github.run_id, github.run_attempt, github.event_name == 'push' && 'main' || 'pr'))
          || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Qualify isolated browser CI runner
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          assert.ok(Number.isSafeInteger(process.getuid()) && process.getuid() > 0);
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(process.env.RUNNER_OS, 'Linux');
          assert.equal(process.env.RUNNER_ARCH, 'ARM64');
          assert.equal(process.env.INSTAFY_CI_JOB_ISOLATION, 'ephemeral');
          assert.ok(!process.env.INSTAFY_ENV_DIR);
          for (const tool of ['bash', 'git', 'curl', 'tar', 'unzip', 'sudo', 'apt-get', 'xvfb-run', 'Xvfb', 'xauth']) {
            execFileSync('/bin/bash', ['-c', 'command -v "$1" >/dev/null', 'browser-ci-preflight', tool], { timeout: 1000, stdio: 'ignore' });
          }
          NODE
      - name: Checkout the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the locked Electron binary
        timeout-minutes: 5
        env:
          NODE_USE_ENV_PROXY: "1"
        run: pnpm --filter @instafy/desktop-app exec install-electron
      - name: Install browser and display dependencies
        run: pnpm --filter @instafy/frontend exec playwright install --with-deps chromium
      - name: Install Linux Electron runtime dependency
        if: runner.environment == 'self-hosted'
        run: sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgtk-3-0t64
      - name: Build the native fixture app
        run: |
          pnpm --filter @instafy/desktop-runtime-agent build
          pnpm --filter @instafy/desktop-app exec tsup
      - name: Prove the test gate rejects skipped and missing cases
        run: |
          node --test scripts/browser-ci.test.mjs scripts/required-browser-reporter.test.mjs scripts/required-browser-reporter.integration.test.mjs scripts/browser-ci-workflow.test.mjs
      - name: Run real Personal Browser cookie and ownership E2E
        run: xvfb-run -a pnpm test:browser:ci personal
      - name: Retain fixture-only results and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: personal-browser-e2e
          path: packages/frontend/test-results/browser-ci/personal
          if-no-files-found: error
          retention-days: 7

  browser-ui:
    name: Browser UI rendering
    runs-on: >-
      ${{ vars.CI_BROWSER_SELF_HOSTED == 'true'
          && github.repository == 'instafy-dev/instafy'
          && github.event.repository.private == true
          && github.workflow_ref == format('instafy-dev/instafy/.github/workflows/build.yml@{0}', github.ref)
          && ((github.event_name == 'pull_request'
               && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number)
               && github.event.pull_request.base.ref == 'main'
               && github.event.pull_request.base.repo.full_name == github.repository
               && github.event.pull_request.head.repo.full_name == github.repository
               && github.event.pull_request.head.repo.fork == false)
              || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true))
          && fromJSON(format('{{"group":"org/instafy-ci-{3}","labels":["self-hosted","Linux","ARM64","instafy-ci-bootstrap-{0}-{1}-{2}-public-browser-ui","instafy-ci-trust-{3}"]}}', github.repository_id, github.run_id, github.run_attempt, github.event_name == 'push' && 'main' || 'pr'))
          || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Qualify isolated browser CI runner
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          assert.ok(Number.isSafeInteger(process.getuid()) && process.getuid() > 0);
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(process.env.RUNNER_OS, 'Linux');
          assert.equal(process.env.RUNNER_ARCH, 'ARM64');
          assert.equal(process.env.INSTAFY_CI_JOB_ISOLATION, 'ephemeral');
          assert.ok(!process.env.INSTAFY_ENV_DIR);
          for (const tool of ['bash', 'git', 'curl', 'tar', 'unzip', 'sudo', 'apt-get', 'xvfb-run', 'Xvfb', 'xauth']) {
            execFileSync('/bin/bash', ['-c', 'command -v "$1" >/dev/null', 'browser-ci-preflight', tool], { timeout: 1000, stdio: 'ignore' });
          }
          NODE
      - name: Checkout the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install locked Chromium and operating-system dependencies
        run: pnpm --filter @instafy/frontend exec playwright install --with-deps chromium
      - name: Prove isolated co-browsing fixture boundaries
        run: node --test scripts/shared-browser-cobrowsing-e2e.test.mjs
      - name: Exercise routine approval and human-input handoff in real Chromium
        run: node scripts/shared-browser-cobrowsing-e2e.mjs
      - name: Run browser component rendering proofs
        run: pnpm test:browser:ci browser-ui
      - name: Retain fixture-only results and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-ui-rendering
          path: |
            packages/frontend/test-results/browser-ci/browser-ui
            packages/frontend/test-results/browser-ci/shared-cobrowsing
          if-no-files-found: error
          retention-days: 7

  shared-profile:
    name: Shared Browser profile E2E
    needs:
      - shared-profile-lifecycle
      - shared-studio
    if: ${{ always() }}
    permissions: {}
    runs-on: >-
      ${{ vars.CI_SHARED_BROWSER_SELF_HOSTED == 'true'
          && github.repository == 'instafy-dev/instafy'
          && github.event.repository.private == true
          && github.workflow_ref == format('instafy-dev/instafy/.github/workflows/build.yml@{0}', github.ref)
          && ((github.event_name == 'pull_request'
               && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number)
               && github.event.pull_request.base.ref == 'main'
               && github.event.pull_request.base.repo.full_name == github.repository
               && github.event.pull_request.head.repo.full_name == github.repository
               && github.event.pull_request.head.repo.fork == false)
              || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true))
          && fromJSON(format('{{"group":"org/instafy-ci-{3}","labels":["self-hosted","Linux","ARM64","instafy-ci-bootstrap-{0}-{1}-{2}-public-shared-browser-aggregate","instafy-ci-trust-{3}"]}}', github.repository_id, github.run_id, github.run_attempt, github.event_name == 'push' && 'main' || 'pr'))
          || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Qualify isolated Shared Browser CI runner
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          assert.ok(Number.isSafeInteger(process.getuid()) && process.getuid() > 0);
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(process.env.RUNNER_OS, 'Linux');
          assert.equal(process.env.RUNNER_ARCH, 'ARM64');
          assert.equal(process.env.INSTAFY_CI_JOB_ISOLATION, 'ephemeral');
          assert.ok(!process.env.INSTAFY_ENV_DIR);
          for (const tool of ['bash']) {
            execFileSync('/bin/bash', ['-c', 'command -v "$1" >/dev/null', 'browser-ci-preflight', tool], { timeout: 1000, stdio: 'ignore' });
          }
          NODE
      - name: Require both complete Shared Browser fixtures
        env:
          SHARED_BROWSER_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const expected = ['shared-profile-lifecycle', 'shared-studio'];
          const results = JSON.parse(process.env.SHARED_BROWSER_RESULTS);
          assert.ok(results && typeof results === 'object' && !Array.isArray(results));
          assert.deepEqual(Object.keys(results).sort(), expected.sort());
          for (const key of expected) assert.equal(results[key].result, 'success', key + ' must succeed');
          NODE

  shared-profile-lifecycle:
    name: Shared Browser profile lifecycle
    runs-on: >-
      ${{ vars.CI_SHARED_BROWSER_SELF_HOSTED == 'true'
          && github.repository == 'instafy-dev/instafy'
          && github.event.repository.private == true
          && github.workflow_ref == format('instafy-dev/instafy/.github/workflows/build.yml@{0}', github.ref)
          && ((github.event_name == 'pull_request'
               && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number)
               && github.event.pull_request.base.ref == 'main'
               && github.event.pull_request.base.repo.full_name == github.repository
               && github.event.pull_request.head.repo.full_name == github.repository
               && github.event.pull_request.head.repo.fork == false)
              || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true))
          && fromJSON(format('{{"group":"org/instafy-ci-{3}","labels":["self-hosted","Linux","ARM64","instafy-ci-bootstrap-{0}-{1}-{2}-public-shared-browser-profile","instafy-ci-trust-{3}"]}}', github.repository_id, github.run_id, github.run_attempt, github.event_name == 'push' && 'main' || 'pr'))
          || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Qualify isolated Shared Browser CI runner
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          assert.ok(Number.isSafeInteger(process.getuid()) && process.getuid() > 0);
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(process.env.RUNNER_OS, 'Linux');
          assert.equal(process.env.RUNNER_ARCH, 'ARM64');
          assert.equal(process.env.INSTAFY_CI_JOB_ISOLATION, 'ephemeral');
          assert.ok(!process.env.INSTAFY_ENV_DIR);
          for (const tool of ['bash', 'git', 'curl', 'tar', 'unzip', 'sudo', 'apt-get', 'xvfb-run', 'Xvfb', 'xauth', 'docker', 'cargo', 'rustc', 'rustup', 'cc', 'pkg-config']) {
            execFileSync('/bin/bash', ['-c', 'command -v "$1" >/dev/null', 'browser-ci-preflight', tool], { timeout: 1000, stdio: 'ignore' });
          }
          const daemon = JSON.parse(execFileSync('docker', ['info', '--format', '{{json .}}'], { timeout: 5000, encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }));
          assert.equal(daemon.OSType, 'linux');
          assert.ok(['aarch64', 'arm64'].includes(daemon.Architecture));
          NODE
      - name: Checkout the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Free space on the disposable hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install locked Chromium and operating-system dependencies
        run: pnpm --filter @instafy/frontend exec playwright install --with-deps chromium
      - name: Bind the launcher to the locked test Chromium
        working-directory: packages/frontend
        run: |
          chromium_path="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          test -x "$chromium_path"
          # This path is confined to a disposable CI runner; it is never
          # installed or changed by the local test script on a user's machine.
          sudo ln -sf "$chromium_path" /usr/bin/chromium
      - name: Install fixture display, database and compiler prerequisites
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo -n apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends x11-utils sqlite3 postgresql-client build-essential pkg-config libssl-dev clang lld cmake libcap-dev protobuf-compiler
          for package in x11-utils sqlite3 postgresql-client build-essential pkg-config libssl-dev clang lld cmake libcap-dev protobuf-compiler; do
            [[ "$(dpkg-query --show --showformat='${Status}' "$package")" == 'install ok installed' ]]
          done
          pkg-config --exists libcap openssl
      - name: Restore Supabase Postgres image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.instafy-image-cache
          key: shared-browser-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test-supabase-migrations-empty-db.mjs') }}
      - name: Restore compiler cache without saving
        if: runner.environment == 'self-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          key: shared-browser-cargo-v1-${{ runner.os }}-${{ runner.arch }}-public-shared-browser-profile-${{ hashFiles('packages/*/Cargo.lock') }}

      - name: Restore architecture-specific compiler cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          key: shared-browser-cargo-v1-${{ runner.os }}-${{ runner.arch }}-public-shared-browser-profile-${{ hashFiles('packages/*/Cargo.lock') }}
      - name: Start disposable migrated Supabase and local authentication
        env:
          SUPABASE_BROWSER_TEST: "1"
        run: |
          node scripts/ensure-supabase-postgres-image.mjs
          pnpm supabase:up
      - name: Test fixture safety guards
        run: node --test scripts/browser-profile-e2e.test.mjs scripts/shared-browser-studio-e2e.test.mjs scripts/lib/sharedStudioProvider.test.mjs scripts/check-shared-browser-ci.test.mjs
      - name: Exercise real Chromium and controller profile lifecycle
        env:
          INSTAFY_SHARED_BROWSER_COMPILER_PROXY: ${{ runner.environment == 'self-hosted' && '1' || '0' }}
        run: xvfb-run -a node scripts/browser-profile-e2e.mjs
      - name: Retain only credential-free browser results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-profile-lifecycle
          path: |
            packages/frontend/test-results/browser-ci/shared-profile/result.json
          if-no-files-found: error
          retention-days: 7
      - name: Stop the disposable authentication stack
        if: always()
        run: pnpm supabase:down

  shared-studio:
    name: Shared Browser Studio journey
    runs-on: >-
      ${{ vars.CI_SHARED_BROWSER_SELF_HOSTED == 'true'
          && github.repository == 'instafy-dev/instafy'
