name: Auth Email E2E

# Guards the signup -> confirmation-email -> activate flow and our custom auth
# email templates. Boots the explicit five-service Auth-only Supabase profile
# (Postgres, GoTrue, PostgREST, Kong and Mailpit) — no runtime controller/agent images — so
# it stays far cheaper than the full e2e stack. Path-triggered so a broken
# template or a changed OTP/config knob fails here instead of in a stranger's
# inbox. The supabase CLI version (package.json/lockfile) is included because it
# determines the bundled mail catcher (Mailpit vs Inbucket) and template loading.

on:
  pull_request:
    paths:
      - ".github/workflows/auth-email.yml"
      - "scripts/auth-email-smoke.mjs"
      - "scripts/check-database-ci-routing.test.mjs"
      - "scripts/supabase-stack.mjs"
      - "scripts/lib/localSupabaseEnv.mjs"
      - "scripts/lib/supabaseStartMode.mjs"
      - "scripts/lib/supabaseStartMode.test.mjs"
      - "scripts/lib/supabaseSerialPull.mjs"
      - "scripts/lib/supabaseSerialPull.test.mjs"
      - "supabase/supabase/templates/**"
      - "supabase/supabase/config.toml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auth-email.yml"
      - "scripts/auth-email-smoke.mjs"
      - "scripts/check-database-ci-routing.test.mjs"
      - "scripts/supabase-stack.mjs"
      - "scripts/lib/localSupabaseEnv.mjs"
      - "scripts/lib/supabaseStartMode.mjs"
      - "scripts/lib/supabaseStartMode.test.mjs"
      - "scripts/lib/supabaseSerialPull.mjs"
      - "scripts/lib/supabaseSerialPull.test.mjs"
      - "supabase/supabase/templates/**"
      - "supabase/supabase/config.toml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: auth-email-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-email:
    name: signup -> email -> activate
    runs-on: >-
      ${{ vars.CI_DATABASE_SELF_HOSTED == 'true'
          && github.repository == 'instafy-dev/instafy'
          && github.event.repository.private == true
          && ((github.event_name == 'pull_request'
               && github.event.pull_request.base.ref == 'main'
               && github.event.pull_request.base.repo.full_name == github.repository
               && github.event.pull_request.head.repo.full_name == github.repository
               && github.event.pull_request.head.repo.fork == false)
              || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true))
          && fromJSON(format('{{"group":"org/instafy-ci-{0}","labels":["self-hosted","Linux","ARM64","instafy-ci-bootstrap-{1}-{2}-{3}-public-auth-email","instafy-ci-trust-{0}"]}}', github.event_name == 'pull_request' && 'pr' || 'main', github.repository_id, github.run_id, github.run_attempt))
          || 'ubuntu-latest' }}
    # `supabase start` pulls several Docker images on a cold runner; cap the job
    # so a hung pull can't burn the 6h default.
    timeout-minutes: 25
    steps:
      - name: Qualify isolated database CI runner
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          assert.ok(Number.isSafeInteger(process.getuid()) && process.getuid() > 0);
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(process.env.RUNNER_OS, 'Linux');
          assert.equal(process.env.RUNNER_ARCH, 'ARM64');
          assert.equal(process.env.INSTAFY_CI_JOB_ISOLATION, 'ephemeral');
          assert.ok(!process.env.INSTAFY_ENV_DIR);
          for (const tool of ['bash', 'git', 'curl', 'tar', 'sha256sum', 'unzip', 'docker']) {
            execFileSync('/bin/bash', ['-c', 'command -v "$1" >/dev/null', 'database-ci-preflight', tool], { timeout: 1000, stdio: 'ignore' });
          }
          const engine = JSON.parse(execFileSync('docker', ['info', '--format', '{{json .}}'], { timeout: 10000, encoding: 'utf8' }));
          assert.equal(engine.OSType, 'linux');
          assert.ok(['aarch64', 'arm64'].includes(engine.Architecture));
          NODE

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          set-safe-directory: true
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify database CI routing contracts
        run: node --test scripts/check-database-ci-routing.test.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Supabase CLI
        run: pnpm exec supabase --version

      # Force a clean start so GoTrue reloads the email templates from config.
      # `supabase:up` reuses an already-running stack and only re-applies
      # migrations; explicitly reset so future runner-image changes cannot leave
      # stale templates and let a template regression pass. No-op on a fresh runner.
      - name: Ensure no stale Supabase stack
        run: pnpm supabase:down || true

      - name: Start local Supabase (GoTrue + mail catcher)
        env:
          SUPABASE_AUTH_ONLY: "1"
        run: pnpm supabase:up

      - name: Run auth email smoke (signup -> email -> activate)
        run: pnpm test:auth:email

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:down || true
