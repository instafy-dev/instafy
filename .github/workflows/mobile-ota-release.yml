name: Mobile OTA Release

# The bot-pushed immutable tag ota-v<sha12> is the ledger: build, sign and publish that protected-main
# commit's web layer to R2 plus a secret-free receipt. Registration/activation stay with the private train.

on:
  push:
    tags:
      - "ota-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (existing, or the intended tag name for a dry run)"
        required: true
        type: string
      dry_run:
        description: "Build, sign and verify but publish nothing"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mobile-ota-release-${{ inputs.dry_run == true && 'dry-run' || inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OTA_CHANNEL: internal
  DOWNLOADS_BUCKET: instafy-downloads
  DOWNLOADS_BASE_URL: https://downloads.instafy.dev
  MOBILE_OTA_DOWNLOADS_PREFIX: mobile
  DESKTOP_DOWNLOADS_PREFIX: desktop-app

jobs:
  authorize:
    name: Authorize the exact OTA tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      mode: ${{ steps.verify.outputs.mode }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      source_sha12: ${{ steps.verify.outputs.source_sha12 }}
      ios_marketing_version: ${{ steps.verify.outputs.ios_marketing_version }}
      ios_build_number: ${{ steps.verify.outputs.ios_build_number }}
      android_version_name: ${{ steps.verify.outputs.android_version_name }}
      android_version_code: ${{ steps.verify.outputs.android_version_code }}
    steps:
      - name: Resolve the tag commit and its protected-main containment
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PUSHER: ${{ github.event.pusher.name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "instafy-dev/instafy" || "$ACTOR" != "instafy-bot" || "$TRIGGERING_ACTOR" != "instafy-bot" ]]; then
            echo "::error::OTA releases run only in instafy-dev/instafy and only for instafy-bot."; exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "$PUSHER" != "instafy-bot" ]]; then
            echo "::error::OTA release tags may only be pushed by instafy-bot."; exit 1
          fi
          tag="$INPUT_TAG"
          if [[ "$EVENT_NAME" == "push" ]]; then tag="$REF_NAME"; fi
          if [[ ! "$tag" =~ ^ota-v[0-9a-f]{12}$ ]]; then
            echo "::error::The OTA release tag must match ota-v<12 lowercase hex>."; exit 1
          fi
          tag_sha=""
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >"$RUNNER_TEMP/tag-ref.json" 2>"$RUNNER_TEMP/tag-ref.err"; then
            test "$(jq -r .ref "$RUNNER_TEMP/tag-ref.json")" = "refs/tags/${tag}"
            tag_sha="$(jq -r .object.sha "$RUNNER_TEMP/tag-ref.json")"
            if [[ "$(jq -r .object.type "$RUNNER_TEMP/tag-ref.json")" == "tag" ]]; then
              tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq 'select(.object.type == "commit") | .object.sha')"
            fi
            [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Tag ${tag} does not peel to a commit."; exit 1; }
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/tag-ref.err"; then
            echo "::error::Unable to resolve tag ${tag}."; exit 1
          fi
          candidate="${tag_sha:-$GITHUB_SHA}"
          compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${candidate}...main" --jq .status)"
          printf 'tag_sha=%s\ncandidate=%s\ncompare_status=%s\n' "$tag_sha" "$candidate" "$compare_status" >> "$GITHUB_OUTPUT"

      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.facts.outputs.candidate }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: Verify tag, actor, exact main and committed native versions
        id: verify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PUSHER: ${{ github.event.pusher.name }}
          REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          TAG_SHA: ${{ steps.facts.outputs.tag_sha }}
          COMPARE_STATUS: ${{ steps.facts.outputs.compare_status }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)" node scripts/release/ota/verify-release-tag.mjs
          node scripts/release/ota/read-committed-mobile-versions.mjs .

      - name: Prove the tag is unpublished (one-shot) and summarize
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.verify.outputs.tag }}
          MODE: ${{ steps.verify.outputs.mode }}
          SUMMARY: "tag `${{ steps.verify.outputs.tag }}`, mode `${{ steps.verify.outputs.mode }}`, commit `${{ steps.verify.outputs.source_sha }}`, iOS ${{ steps.verify.outputs.ios_marketing_version }} (${{ steps.verify.outputs.ios_build_number }}), Android ${{ steps.verify.outputs.android_version_name }} (${{ steps.verify.outputs.android_version_code }})"
        run: |
          set -euo pipefail
          if [[ "$MODE" == "release" ]]; then
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>"$RUNNER_TEMP/release.err"; then
              echo "::error::A GitHub Release already exists for ${TAG}; publication is one-shot."; exit 1
            fi
            grep -q 'HTTP 404' "$RUNNER_TEMP/release.err"
            for name in "${TAG}.zip" "${TAG}.manifest.json"; do
              url="${DOWNLOADS_BASE_URL%/}/${MOBILE_OTA_DOWNLOADS_PREFIX}/${name}"
              code="$(curl --silent --head --output /dev/null --max-time 30 --write-out '%{http_code}' "$url" || true)"
              if [[ "$code" != "404" ]]; then
                echo "::error::${url} answered ${code}; the object exists or its absence cannot be proven."; exit 1
              fi
            done
          fi
          printf '### Mobile OTA authorization\n\n%s\n' "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Build the exact mobile web layer
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
      VITE_BUILD_GIT_BRANCH: main
      VITE_BUILD_GIT_SHA: ${{ needs.authorize.outputs.source_sha }}
      VITE_BUILD_GIT_SHA_SHORT: ${{ needs.authorize.outputs.source_sha12 }}
      VITE_CONTROLLER_URL: ${{ vars.VITE_CONTROLLER_URL || 'https://controller.instafy.dev' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_DOWNLOADS_BASE_URL: https://downloads.instafy.dev
      VITE_DESKTOP_DOWNLOADS_PREFIX: desktop-app
      VITE_INSTAFY_SHARED_BROWSER_CDP_SCREENCAST: "1"
      VITE_INSTAFY_SHARED_BROWSER_WEBRTC: "0"
      VITE_REQUIRE_AUTH: ${{ vars.VITE_REQUIRE_AUTH }}
      VITE_USE_WEBCONTAINER: ${{ vars.VITE_USE_WEBCONTAINER }}
      VITE_OTA_CHANNEL: internal
    outputs:
      dist_inventory_sha256: ${{ steps.dist.outputs.inventory_sha256 }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: recursive

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Verify the toolchain and publishable configuration, then build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(pnpm --version)" = "10.34.5"
          case "$(node --version)" in v22.*) ;; *) echo "::error::Node 22 is required."; exit 1 ;; esac
          node scripts/release/ota/browser-safe-config.mjs
          pnpm install --frozen-lockfile
          pnpm --filter @instafy/frontend build

      - name: Prove the web layer is exact, web-only and credential-free
        id: dist
        run: |
          set -euo pipefail
          inventory="$(bash scripts/release/ota/prove-web-layer.sh packages/frontend/dist "$SOURCE_SHA")"
          echo "inventory_sha256=${inventory}" >> "$GITHUB_OUTPUT"

      - name: Upload the unsigned web layer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-ota-web-${{ needs.authorize.outputs.tag }}
          path: packages/frontend/dist
          if-no-files-found: error
          retention-days: 1

      - name: Summarize the web build
        env:
          INVENTORY: ${{ steps.dist.outputs.inventory_sha256 }}
        run: |
          set -euo pipefail
          printf '### Mobile web layer\n\n- commit `%s`, channel `internal`, inventory sha256 `%s`\n' "$SOURCE_SHA" "$INVENTORY" >> "$GITHUB_STEP_SUMMARY"

  sign:
    name: Sign and verify the OTA bundle
    needs: [authorize, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ota-release
    env:
      TAG: ${{ needs.authorize.outputs.tag }}
      SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Download the unsigned web layer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mobile-ota-web-${{ needs.authorize.outputs.tag }}
          path: packages/frontend/dist

      - name: Verify the downloaded web layer is the built one
        env:
          INVENTORY: ${{ needs.web.outputs.dist_inventory_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          command -v zip >/dev/null || { echo "::error::zip is required."; exit 1; }; command -v python3 >/dev/null || { echo "::error::python3 is required."; exit 1; }
          test "$(bash scripts/release/ota/prove-web-layer.sh packages/frontend/dist "$SOURCE_SHA")" = "$INVENTORY"

      - name: Resolve the native trust anchor from the signing key
        id: anchor
        env:
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
          CAPACITOR_LIVE_UPDATE_PUBLIC_KEY: ${{ vars.CAPACITOR_LIVE_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${CAPACITOR_LIVE_UPDATE_PUBLIC_KEY:-}" ]]; then
            echo "::error::Set the CAPACITOR_LIVE_UPDATE_PUBLIC_KEY variable; the signing key must match the shipped shells."; exit 1
          fi
          node scripts/resolve-live-update-public-key.mjs --require-private-key

      - name: Build and sign the OTA bundle
        id: bundle
        env:
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/build-ota-bundle.mjs --dist packages/frontend/dist --out "$RUNNER_TEMP/ota" \
            --git-sha "$SOURCE_SHA" --bundle-version "$TAG"

      - name: Verify the trust anchor and the signed bundle like a device
        env:
          ARCHIVE_FILE_NAME: ${{ steps.bundle.outputs.ota_archive_file_name }}
          EXPECTED_TRUST_KEY_SHA256: ${{ steps.anchor.outputs.public_key_sha256 }}
        run: |
          set -euo pipefail
          node scripts/release/ota/verify-public-bytes.mjs anchor
          [[ "$ARCHIVE_FILE_NAME" == "${TAG}.zip" ]] || { echo "::error::The downloads Worker serves only <tag>.zip as immutable."; exit 1; }
          ARCHIVE_PATH="$RUNNER_TEMP/ota/${TAG}.zip" MANIFEST_PATH="$RUNNER_TEMP/ota/${TAG}.manifest.json" \
            node scripts/release/ota/verify-public-bytes.mjs local
          python3 scripts/release/ota/validate-ota-web-archive.py "$RUNNER_TEMP/ota/${TAG}.zip"

      - name: Scan the final OTA archive with pinned Gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check --status
          mkdir -m 700 "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          scan_root="$RUNNER_TEMP/ota-archive-scan"
          mkdir -m 700 "$scan_root"
          cp "$RUNNER_TEMP/ota/${TAG}.zip" "$scan_root/instafy-release.ota.zip"
          node scripts/release/ota/gitleaks-release-artifact.mjs --root "$scan_root" \
            --config scripts/public-boundary-gitleaks.toml --executable "$RUNNER_TEMP/gitleaks-bin/gitleaks"

      - name: Render both registration payloads
        env:
          IOS_VERSION: ${{ needs.authorize.outputs.ios_marketing_version }}
          IOS_BUILD: ${{ needs.authorize.outputs.ios_build_number }}
          ANDROID_VERSION: ${{ needs.authorize.outputs.android_version_name }}
          ANDROID_CODE: ${{ needs.authorize.outputs.android_version_code }}
          TRUST_KEY_SHA256: ${{ steps.anchor.outputs.public_key_sha256 }}
        run: |
          set -euo pipefail
          archive_url="${DOWNLOADS_BASE_URL%/}/${MOBILE_OTA_DOWNLOADS_PREFIX}/${TAG}.zip"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for platform in ios android; do
            if [[ "$platform" == "ios" ]]; then version="$IOS_VERSION"; build="$IOS_BUILD"; else version="$ANDROID_VERSION"; build="$ANDROID_CODE"; fi
            node scripts/render-ota-release-payload.mjs --manifest "$RUNNER_TEMP/ota/${TAG}.manifest.json" \
              --artifact-url "$archive_url" --platform "$platform" --channel "$OTA_CHANNEL" \
              --native-version "$version" --min-supported-native-version "$version" --required-native-build "$build" \
              --status live --rollout-percentage 100 --published-by "github-actions:mobile-ota-release:${GITHUB_RUN_ID}" \
              --published-at "$published_at" --out "$RUNNER_TEMP/ota/${platform}-internal-${TAG}.release.json"
          done
          printf '%s\n' "$TRUST_KEY_SHA256" > "$RUNNER_TEMP/ota/trust-key.sha256"
          test "$(find "$RUNNER_TEMP/ota" -type f | wc -l)" -eq 5

      - name: Upload the signed OTA release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-ota-${{ needs.authorize.outputs.tag }}
          path: ${{ runner.temp }}/ota
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ needs.authorize.outputs.mode == 'release' && 30 || 7 }}

      - name: Summarize the signed bundle
        env:
          TRUST_KEY_SHA256: ${{ steps.anchor.outputs.public_key_sha256 }}
          ARCHIVE_SHA256: ${{ steps.bundle.outputs.ota_archive_sha256 }}
          MODE: ${{ needs.authorize.outputs.mode }}
        run: |
          set -euo pipefail
          printf '### Signed OTA bundle\n\n- `%s` (%s), archive `%s`, trust key `%s`\n' "$TAG" "$MODE" "$ARCHIVE_SHA256" "$TRUST_KEY_SHA256" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish immutable OTA objects and the release receipt
    needs: [authorize, sign]
    if: ${{ needs.authorize.outputs.mode == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ota-release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.authorize.outputs.tag }}
      SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
      CAPACITOR_LIVE_UPDATE_PUBLIC_KEY: ${{ vars.CAPACITOR_LIVE_UPDATE_PUBLIC_KEY }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Download the signed OTA release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mobile-ota-${{ needs.authorize.outputs.tag }}
          path: ${{ runner.temp }}/ota

      - name: Re-verify the signed set against the trust anchor variable
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(find "$RUNNER_TEMP/ota" -type f | wc -l)" -eq 5
          EXPECTED_TRUST_KEY_SHA256="$(cat "$RUNNER_TEMP/ota/trust-key.sha256")" \
            node scripts/release/ota/verify-public-bytes.mjs anchor
          ARCHIVE_PATH="$RUNNER_TEMP/ota/${TAG}.zip" MANIFEST_PATH="$RUNNER_TEMP/ota/${TAG}.manifest.json" \
            node scripts/release/ota/verify-public-bytes.mjs local

      - name: Re-check the tag binding, then publish immutable R2 objects (archive before manifest)
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_R2_API_TOKEN are required in ota-release."; exit 1
          fi
          node scripts/release/ota/tag-state.mjs
          tool_root="$RUNNER_TEMP/instafy-wrangler"
          mkdir -m 700 "$tool_root"
          (unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; npm install --prefix "$tool_root" --ignore-scripts --no-audit --no-fund --save-exact wrangler@4.73.0)
          WRANGLER="$tool_root/node_modules/.bin/wrangler"
          test "$("$WRANGLER" --version)" = "4.73.0"
          export WRANGLER
          bash scripts/release/ota/put-immutable.sh "$RUNNER_TEMP/ota/${TAG}.zip" "${MOBILE_OTA_DOWNLOADS_PREFIX}/${TAG}.zip" application/zip
          bash scripts/release/ota/put-immutable.sh "$RUNNER_TEMP/ota/${TAG}.manifest.json" "${MOBILE_OTA_DOWNLOADS_PREFIX}/${TAG}.manifest.json" application/json

      - name: Prove the public bytes are the exact signed release
        run: |
          set -euo pipefail
          base="${DOWNLOADS_BASE_URL%/}/${MOBILE_OTA_DOWNLOADS_PREFIX}"
          ARCHIVE_PATH="$RUNNER_TEMP/ota/${TAG}.zip" MANIFEST_PATH="$RUNNER_TEMP/ota/${TAG}.manifest.json" \
            ARCHIVE_URL="${base}/${TAG}.zip" MANIFEST_URL="${base}/${TAG}.manifest.json" \
            node scripts/release/ota/verify-public-bytes.mjs public

      - name: Write the secret-free release receipt
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          IOS_VERSION: ${{ needs.authorize.outputs.ios_marketing_version }}
          IOS_BUILD: ${{ needs.authorize.outputs.ios_build_number }}
          ANDROID_VERSION: ${{ needs.authorize.outputs.android_version_name }}
          ANDROID_CODE: ${{ needs.authorize.outputs.android_version_code }}
        run: |
          set -euo pipefail
          ota="$RUNNER_TEMP/ota" base="${DOWNLOADS_BASE_URL%/}/${MOBILE_OTA_DOWNLOADS_PREFIX}"
          node scripts/release/ota/write-receipt.mjs --tag "$TAG" --source-sha "$SOURCE_SHA" --workflow-ref "$WORKFLOW_REF" \
            --ios-marketing-version "$IOS_VERSION" --ios-build-number "$IOS_BUILD" \
            --android-version-name "$ANDROID_VERSION" --android-version-code "$ANDROID_CODE" \
            --archive "$ota/${TAG}.zip" --manifest "$ota/${TAG}.manifest.json" \
            --archive-url "${base}/${TAG}.zip" --manifest-url "${base}/${TAG}.manifest.json" \
            --payload "ios=$ota/ios-internal-${TAG}.release.json" --payload "android=$ota/android-internal-${TAG}.release.json" \
            --trust-key-sha256 "$(cat "$ota/trust-key.sha256")" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --out "$RUNNER_TEMP/release-receipt.json"

      - name: Create the GitHub Release (last publication step)
        env:
          GH_TOKEN: ${{ github.token }}
          IOS: ${{ needs.authorize.outputs.ios_marketing_version }}/${{ needs.authorize.outputs.ios_build_number }}
          ANDROID: ${{ needs.authorize.outputs.android_version_name }}/${{ needs.authorize.outputs.android_version_code }}
        run: |
          set -euo pipefail
          node scripts/release/ota/tag-state.mjs
          ota="$RUNNER_TEMP/ota"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
            --title "Instafy Mobile OTA ${TAG}" \
            --notes "channel internal, source ${SOURCE_SHA}, ios ${IOS}, android ${ANDROID}; activation by the private train" \
            "$ota/${TAG}.zip" "$ota/${TAG}.manifest.json" \
            "$ota/ios-internal-${TAG}.release.json" "$ota/android-internal-${TAG}.release.json" \
            "$RUNNER_TEMP/release-receipt.json"
          base="${DOWNLOADS_BASE_URL%/}/${MOBILE_OTA_DOWNLOADS_PREFIX}"
          printf '### Mobile OTA published\n\n- archive: %s\n- manifest: %s\n- trust key sha256: `%s`\n- receipt: https://github.com/%s/releases/download/%s/release-receipt.json\n- activation: private train\n' \
            "${base}/${TAG}.zip" "${base}/${TAG}.manifest.json" "$(cat "$ota/trust-key.sha256")" \
            "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
