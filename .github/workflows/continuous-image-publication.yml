name: Publish images after protected main

# The latest protected-main commit gets both immutable image manifests after
# its exact CI succeeds. If main advances, older queued runs yield to the newer
# cumulative source. Each pass reconciles once without waiting for Build or
# child publishers; the six-hour schedule reconciles deferred work. A successful
# coordinator is not publication proof: consumers require sealed child manifests.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA; must equal current protected main
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: continuous-production-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact protected-main images after CI
    if: >-
      github.repository == 'instafy-dev/instafy' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Authorize the exact current protected-main commit
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The release source must be a full lowercase commit SHA."
            exit 1
          fi
          if [[ "$REQUESTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::The release source must equal the workflow's protected-main commit."
            exit 1
          fi
          current_main="$(
            gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/commits/main" \
              --jq .sha
          )"
          if [[ "$current_main" != "$REQUESTED_COMMIT" ]]; then
            echo "Protected main advanced to ${current_main}; the newer queued run owns publication."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$REQUESTED_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Inspect exact protected-main CI without waiting
        if: ${{ steps.source.outputs.current == 'true' }}
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          runs="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?event=push&head_sha=${RELEASE_COMMIT}&per_page=100")"
          jq -e --arg sha "$RELEASE_COMMIT" '
            (.total_count | type) == "number" and
            .total_count == (.workflow_runs | length) and .total_count <= 100 and
            all(.workflow_runs[];
              .repository.full_name == "instafy-dev/instafy" and
              .path == ".github/workflows/build.yml" and
              .head_sha == $sha and .head_branch == "main" and .event == "push" and
              (.status | IN("completed", "queued", "in_progress", "waiting", "pending", "requested")))
          ' <<<"$runs" >/dev/null
          conclusion="$(jq -r '
            .workflow_runs |
            if length == 0 or any(.[]; .status != "completed") then "deferred"
            elif any(.[]; .conclusion == "success") then "success"
            else "failed" end
          ' <<<"$runs")"
          case "$conclusion" in
            success) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            deferred)
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Publication deferred: exact Public Build is not complete; no publishers dispatched." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "::error::Public Build did not pass for ${RELEASE_COMMIT}."; exit 1 ;;
          esac

      - name: Recheck protected main before publication
        if: ${{ steps.ci.outputs.ready == 'true' }}
        id: recheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          current_main="$(
            gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/commits/main" \
              --jq .sha
          )"
          if [[ "$current_main" != "$RELEASE_COMMIT" ]]; then
            echo "Protected main advanced after CI; the newer queued run owns publication."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Reconcile exact publishers and manifest freshness
        if: ${{ steps.recheck.outputs.current == 'true' }}
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          minimum_expiry_epoch="$(( $(date -u +%s) + 14 * 24 * 60 * 60 ))"

          manifest_is_fresh() {
            local workflow="$1"
            local artifact_name="$2"
            local runs run_id run artifacts matches expires_at expires_epoch
            runs="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f event=workflow_dispatch \
              -f head_sha="$RELEASE_COMMIT" \
              -f per_page=100)" || return 2
            jq -e --arg sha "$RELEASE_COMMIT" --arg path ".github/workflows/${workflow}" '
              (.total_count | type) == "number" and
              .total_count == (.workflow_runs | length) and .total_count <= 100 and
              ([.workflow_runs[].id] | unique | length) == .total_count and
              all(.workflow_runs[];
                (.id | type) == "number" and .id > 0 and .id == (.id | floor) and
                .repository.full_name == "instafy-dev/instafy" and .path == $path and
                .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and
                (.status | IN("completed", "queued", "in_progress", "waiting", "pending", "requested")))
            ' <<<"$runs" >/dev/null || return 2
            if jq -e 'any(.workflow_runs[]; .status != "completed")' <<<"$runs" >/dev/null; then
              return 3
            fi
            while read -r run_id; do
              [[ -n "$run_id" ]] || continue
              run="$(jq -ec --argjson id "$run_id" \
                '.workflow_runs[] | select(.id == $id)' <<<"$runs")" || return 2
              jq -e \
                --arg sha "$RELEASE_COMMIT" \
                --arg path ".github/workflows/${workflow}" '
                  .repository.full_name == "instafy-dev/instafy" and
                  .path == $path and
                  .event == "workflow_dispatch" and
                  .head_branch == "main" and
                  .head_sha == $sha and
                  .status == "completed" and
                  .conclusion == "success"
                ' <<<"$run" >/dev/null || return 2
              artifacts="$(gh api --method GET \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
                -f per_page=100)" || return 2
              if ! jq -e '(.total_count | type) == "number" and
                .total_count == (.artifacts | length) and .total_count <= 100' <<<"$artifacts" >/dev/null; then
                echo "::error::Release run ${run_id} has an incomplete or unbounded artifact inventory." >&2
                return 2
              fi
              matches="$(jq -ec --arg name "$artifact_name" \
                '[.artifacts[] | select(.name == $name)]' <<<"$artifacts")" || return 2
              if [[ "$(jq -er 'length' <<<"$matches")" -gt 1 ]]; then
                echo "::error::Release run ${run_id} has duplicate ${artifact_name} artifacts." >&2
                return 2
              fi
              if [[ "$(jq -er 'length' <<<"$matches")" == "1" ]] &&
                 jq -e '
                   .[0].expired == false and
                   (. [0].digest | type) == "string" and
                   (. [0].digest | test("^sha256:[0-9a-f]{64}$")) and
                   (. [0].expires_at | type) == "string"
                 ' <<<"$matches" >/dev/null; then
                expires_at="$(jq -er '.[0].expires_at' <<<"$matches")" || return 2
                expires_epoch="$(date -u -d "$expires_at" +%s)" || return 2
                if [[ "$expires_epoch" -ge "$minimum_expiry_epoch" ]]; then
                  return 0
                fi
              fi
            done < <(jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' <<<"$runs")
            if jq -e 'any(.workflow_runs[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "::error::A sealed ${workflow} publication has no fresh manifest; immutable publication cannot be repeated." >&2
              return 2
            fi
            return 1
          }

          services_fresh=false
          services_publish=true
          pending=false
          if manifest_is_fresh \
            publish-production-services.yml \
            production-service-release-manifest; then
            services_fresh=true
            services_publish=false
          else
            status=$?
            case "$status" in
              1) ;;
              3) pending=true; services_publish=false ;;
              *) exit "$status" ;;
            esac
          fi
          runtime_fresh=false
          runtime_publish=true
          if manifest_is_fresh \
            publish-runtime-agent.yml \
            runtime-agent-release-manifest; then
            runtime_fresh=true
            runtime_publish=false
          else
            status=$?
            case "$status" in
              1) ;;
              3) pending=true; runtime_publish=false ;;
              *) exit "$status" ;;
            esac
          fi
          echo "services_publish=$services_publish" >> "$GITHUB_OUTPUT"
          echo "runtime_publish=$runtime_publish" >> "$GITHUB_OUTPUT"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if [[ "$pending" == "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Publication deferred: an exact publisher is still active; no duplicate publishers dispatched." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$services_fresh" == "true" && "$runtime_fresh" == "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch missing immutable image publishers without waiting
        if: >-
          steps.recheck.outputs.current == 'true' &&
          steps.freshness.outputs.publish == 'true'
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit_sha }}
          PUBLISH_SERVICES: ${{ steps.freshness.outputs.services_publish }}
          PUBLISH_RUNTIME: ${{ steps.freshness.outputs.runtime_publish }}
        run: |
          set -euo pipefail
          current_main="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$current_main" != "$RELEASE_COMMIT" ]]; then
            echo "Publication deferred: protected main advanced before dispatch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dispatch() {
            local workflow="$1"
            local inputs="$2"
            gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              --input - <<JSON
          {"ref":"main","inputs":${inputs}}
          JSON
          }

          services_run_id=""
          services_url=""
          runtime_run_id=""
          runtime_url=""
          if [[ "$PUBLISH_SERVICES" == "true" ]]; then
            services="$(
              dispatch \
                publish-production-services.yml \
                "{\"commit_sha\":\"${RELEASE_COMMIT}\"}"
            )"
            services_run_id="$(jq -er '.workflow_run_id' <<<"$services")"
            services_url="$(jq -er '.html_url' <<<"$services")"
          fi
          if [[ "$PUBLISH_RUNTIME" == "true" ]]; then
            runtime="$(
              dispatch \
                publish-runtime-agent.yml \
                "{\"commit_sha\":\"${RELEASE_COMMIT}\",\"update_channel_tags\":false}"
            )"
            runtime_run_id="$(jq -er '.workflow_run_id' <<<"$runtime")"
            runtime_url="$(jq -er '.html_url' <<<"$runtime")"
          fi
          for run_id in "$services_run_id" "$runtime_run_id"; do
            [[ -n "$run_id" ]] || continue
            if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::GitHub did not return an exact child workflow run ID."
              exit 1
            fi
          done
          if [[ -n "$services_run_id" && "$services_run_id" == "$runtime_run_id" ]]; then
            echo "::error::The two image publishers returned the same run ID."
            exit 1
          fi
          {
            echo "services_run_id=$services_run_id"
            echo "runtime_run_id=$runtime_run_id"
            echo "services_url=$services_url"
            echo "runtime_url=$runtime_url"
            echo "dispatched=true"
          } >> "$GITHUB_OUTPUT"

      - name: Report requested immutable image publication
        if: ${{ steps.dispatch.outputs.dispatched == 'true' }}
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit_sha }}
          PUBLISH_SERVICES: ${{ steps.freshness.outputs.services_publish }}
          PUBLISH_RUNTIME: ${{ steps.freshness.outputs.runtime_publish }}
          SERVICES_RUN_ID: ${{ steps.dispatch.outputs.services_run_id }}
          SERVICES_URL: ${{ steps.dispatch.outputs.services_url }}
          RUNTIME_RUN_ID: ${{ steps.dispatch.outputs.runtime_run_id }}
          RUNTIME_URL: ${{ steps.dispatch.outputs.runtime_url }}
        run: |
          {
            echo "### Immutable image publication dispatched, not yet verified"
            echo
            echo "- Public core: \`${RELEASE_COMMIT}\`"
            if [[ "$PUBLISH_SERVICES" == "true" ]]; then
              echo "- Production services: [run ${SERVICES_RUN_ID}](${SERVICES_URL})"
            else
              echo "- Production services: retained the existing fresh manifest"
            fi
            if [[ "$PUBLISH_RUNTIME" == "true" ]]; then
              echo "- Runtime agent: [run ${RUNTIME_RUN_ID}](${RUNTIME_URL})"
            else
              echo "- Runtime agent: retained the existing fresh manifest"
            fi
            echo "- Mutable channel tags were not moved."
            echo "- Child publishers must still pass their build, scan and immutable manifest gates."
            echo "- A later reconciliation checks sealed manifests; this coordinator does not wait or certify publication."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report fresh immutable manifests
        if: >-
          steps.recheck.outputs.current == 'true' &&
          steps.freshness.outputs.publish == 'false' &&
          steps.freshness.outputs.pending == 'false'
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit_sha }}
        run: |
          {
            echo "### Immutable production images are fresh"
            echo
            echo "- Public core: \`$RELEASE_COMMIT\`"
            echo "- Both exact manifests remain live for at least 14 days, so no image was rebuilt or pushed."
          } >> "$GITHUB_STEP_SUMMARY"
