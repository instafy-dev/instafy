name: Publish images after protected main

# The latest protected-main commit gets both immutable image manifests after
# its exact CI succeeds. If main advances, older queued runs yield to the newer
# cumulative source. Each pass reconciles once without waiting for Build or
# child publishers. The push run usually finds Build still running and defers;
# the completion of that exact push Build then starts a pass that publishes, and
# the six-hour schedule reconciles anything left. A successful coordinator is
# not publication proof: consumers require sealed child manifests.
#
# A third, best-effort lane publishes the arm64 runtime images and multi-arch
# tags (publish-runtime-agent-multiarch.yml) once the amd64 production runtime
# manifest is sealed. It runs last, retries a failed commit up to a cap, and can
# only warn: it never fails a pass or changes the production lanes.
on:
  push:
    branches:
      - main
  workflow_run:
    workflows: [Public Build]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA; must equal current protected main
        required: true
        type: string

permissions:
  contents: read
  actions: write

# A Build completion that does not qualify is skipped by the job guard, but a
# workflow-level group would still admit it, and GitHub keeps one pending run
# per group: a stream of fork or failed Build completions could cancel the real
# pending pass. Such runs get a group of their own.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_run' && !(
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.path == '.github/workflows/build.yml' &&
          github.event.workflow_run.repository.full_name == 'instafy-dev/instafy' &&
          github.event.workflow_run.head_repository.full_name == 'instafy-dev/instafy')
        && format('continuous-production-images-ignored-{0}', github.run_id)
        || 'continuous-production-images' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact protected-main images after CI
    # A Build completion runs with this repository's token, so only the exact
    # successful protected-main push Build of this repository may start a pass;
    # a fork or pull-request Build never does.
    if: >-
      github.repository == 'instafy-dev/instafy' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.path == '.github/workflows/build.yml' &&
        github.event.workflow_run.repository.full_name == 'instafy-dev/instafy' &&
        github.event.workflow_run.head_repository.full_name == 'instafy-dev/instafy'))
    runs-on: >-
      ${{ vars.CI_PUBLIC_CONTROL_SELF_HOSTED == 'true'
          && github.repository == 'instafy-dev/instafy'
          && github.repository_id == '1309636737'
          && github.event.repository.private == true
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && github.ref_protected == true
          && github.workflow_ref == 'instafy-dev/instafy/.github/workflows/continuous-image-publication.yml@refs/heads/main'
          && fromJSON(format('{{"group":"org/instafy-ci-main","labels":["self-hosted","Linux","ARM64","instafy-ci-bootstrap-{0}-{1}-{2}-public-image-coordinator","instafy-ci-trust-main"]}}', github.repository_id, github.run_id, github.run_attempt))
          || vars.TRUSTED_AMD64_BUILD_RUNNER_MODE == 'self-hosted'
          && github.repository == 'instafy-dev/instafy'
          && github.repository_id == '1309636737'
          && github.event.repository.private == true
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
          && github.ref_protected == true
          && github.workflow_ref == 'instafy-dev/instafy/.github/workflows/continuous-image-publication.yml@refs/heads/main'
          && github.workflow_sha == github.sha
          && (github.event_name == 'schedule' || inputs.commit_sha == github.sha)
          && fromJSON('{"group":"org/instafy-trusted-build","labels":["self-hosted","Linux","X64","instafy-build"]}')
          || 'ubuntu-24.04' }}
    # Five minutes for the production steps, plus the arm64 lane's own
    # two-minute step bound.
    timeout-minutes: 7

    steps:
      - name: Qualify isolated protected-main control runner
        if: runner.environment == 'self-hosted' && github.event_name == 'push'
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.env.GITHUB_REPOSITORY, 'instafy-dev/instafy');
          assert.equal(process.env.GITHUB_REPOSITORY_ID, '1309636737');
          assert.equal(process.env.GITHUB_EVENT_NAME, 'push');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          assert.equal(process.env.GITHUB_REF_PROTECTED, 'true');
          assert.equal(process.env.GITHUB_WORKFLOW_REF, 'instafy-dev/instafy/.github/workflows/continuous-image-publication.yml@refs/heads/main');
          assert.match(process.env.GITHUB_SHA, /^[0-9a-f]{40}$/);
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          assert.ok(Number.isSafeInteger(process.getuid()) && process.getuid() > 0);
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(process.env.RUNNER_OS, 'Linux');
          assert.equal(process.env.RUNNER_ARCH, 'ARM64');
          assert.equal(process.env.INSTAFY_CI_JOB_ISOLATION, 'ephemeral');
          assert.ok(!process.env.INSTAFY_ENV_DIR);
          for (const tool of ['bash', 'gh', 'jq', 'date']) {
            execFileSync('/bin/bash', ['-c', 'command -v "$1" >/dev/null', 'public-control-preflight', tool], { timeout: 1000, stdio: 'ignore' });
          }
          assert.equal(execFileSync('date', ['-u', '-d', '1970-01-01T00:00:00Z', '+%s'], { timeout: 1000, encoding: 'utf8' }).trim(), '0');
          NODE

      - name: Qualify trusted image reconciliation runner
        if: runner.environment == 'self-hosted' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.env.GITHUB_REPOSITORY, 'instafy-dev/instafy');
          assert.equal(process.env.GITHUB_REPOSITORY_ID, '1309636737');
          assert.ok(['schedule', 'workflow_dispatch'].includes(process.env.GITHUB_EVENT_NAME));
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          assert.equal(process.env.GITHUB_REF_PROTECTED, 'true');
          assert.equal(process.env.GITHUB_WORKFLOW_REF, 'instafy-dev/instafy/.github/workflows/continuous-image-publication.yml@refs/heads/main');
          assert.match(process.env.GITHUB_SHA, /^[0-9a-f]{40}$/);
          assert.equal(process.env.GITHUB_WORKFLOW_SHA, process.env.GITHUB_SHA);
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'x64');
          assert.ok(Number.isSafeInteger(process.getuid()) && process.getuid() > 0);
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(process.env.RUNNER_OS, 'Linux');
          assert.equal(process.env.RUNNER_ARCH, 'X64');
          assert.ok(!process.env.INSTAFY_ENV_DIR);
          for (const tool of ['bash', 'gh', 'jq', 'date']) {
            execFileSync('/bin/bash', ['-c', 'command -v "$1" >/dev/null', 'public-image-build-preflight', tool], { timeout: 1000, stdio: 'ignore' });
          }
          assert.equal(execFileSync('date', ['-u', '-d', '1970-01-01T00:00:00Z', '+%s'], { timeout: 1000, encoding: 'utf8' }).trim(), '0');
          NODE

      - name: Authorize the exact current protected-main commit
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The release source must be a full lowercase commit SHA."
            exit 1
          fi
          # A Build completion names the commit it built; if main moved on
          # meanwhile, the newer commit's own Build completion owns publication.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$REQUESTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Protected main advanced past ${REQUESTED_COMMIT}; the newer commit's Build owns publication."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$REQUESTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::The release source must equal the workflow's protected-main commit."
            exit 1
          fi
          current_main="$(
            gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/commits/main" \
              --jq .sha
          )"
          if [[ "$current_main" != "$REQUESTED_COMMIT" ]]; then
            echo "Protected main advanced to ${current_main}; the newer queued run owns publication."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$REQUESTED_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Inspect exact protected-main CI without waiting
        if: ${{ steps.source.outputs.current == 'true' }}
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit_sha }}
          BUILD_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          # GitHub's event-filtered run listings are intermittently served from a
          # stale index, so none is used here. A Build completion is checked by
          # reading its own run; other passes list the commit's runs and keep only
          # the exact protected-main push Builds.
          build_run_id="${BUILD_RUN_ID:-}"
          if [[ -n "$build_run_id" ]]; then
            [[ "$build_run_id" =~ ^[1-9][0-9]*$ ]]
            runs="$(gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${build_run_id}" |
              jq -c '{total_count: 1, workflow_runs: [.]}')"
          else
            runs="$(gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?head_sha=${RELEASE_COMMIT}&per_page=100")"
            jq -e '
              (.total_count | type) == "number" and
              .total_count == (.workflow_runs | length) and .total_count <= 100
            ' <<<"$runs" >/dev/null
            runs="$(jq -c '{workflow_runs: [.workflow_runs[] | select(.event == "push")]}
              | .total_count = (.workflow_runs | length)' <<<"$runs")"
          fi
          jq -e --arg sha "$RELEASE_COMMIT" '
            (.total_count | type) == "number" and
            .total_count == (.workflow_runs | length) and .total_count <= 100 and
            all(.workflow_runs[];
              .repository.full_name == "instafy-dev/instafy" and
              .path == ".github/workflows/build.yml" and
              .head_sha == $sha and .head_branch == "main" and .event == "push" and
              (.status | IN("completed", "queued", "in_progress", "waiting", "pending", "requested")))
          ' <<<"$runs" >/dev/null
          conclusion="$(jq -r '
            .workflow_runs |
            if length == 0 or any(.[]; .status != "completed") then "deferred"
            elif any(.[]; .conclusion == "success") then "success"
            else "failed" end
          ' <<<"$runs")"
          case "$conclusion" in
            success) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            deferred)
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Publication deferred: exact Public Build is not complete; no publishers dispatched." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "::error::Public Build did not pass for ${RELEASE_COMMIT}."; exit 1 ;;
          esac

      - name: Recheck protected main before publication
        if: ${{ steps.ci.outputs.ready == 'true' }}
        id: recheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          current_main="$(
            gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/commits/main" \
              --jq .sha
          )"
          if [[ "$current_main" != "$RELEASE_COMMIT" ]]; then
            echo "Protected main advanced after CI; the newer queued run owns publication."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Reconcile exact publishers and manifest freshness
        if: ${{ steps.recheck.outputs.current == 'true' }}
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          minimum_expiry_epoch="$(( $(date -u +%s) + 14 * 24 * 60 * 60 ))"

          manifest_is_fresh() {
            local workflow="$1"
            local artifact_name="$2"
            local runs run_id run artifacts matches expires_at expires_epoch
            runs="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f head_sha="$RELEASE_COMMIT" \
              -f per_page=100)" || return 2
            jq -e --arg sha "$RELEASE_COMMIT" --arg path ".github/workflows/${workflow}" '
              (.total_count | type) == "number" and
              .total_count == (.workflow_runs | length) and .total_count <= 100 and
              ([.workflow_runs[].id] | unique | length) == .total_count and
              all(.workflow_runs[];
                (.id | type) == "number" and .id > 0 and .id == (.id | floor) and
                .repository.full_name == "instafy-dev/instafy" and .path == $path and
                .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and
                (.status | IN("completed", "queued", "in_progress", "waiting", "pending", "requested")))
            ' <<<"$runs" >/dev/null || return 2
            if jq -e 'any(.workflow_runs[]; .status != "completed")' <<<"$runs" >/dev/null; then
              return 3
            fi
            while read -r run_id; do
              [[ -n "$run_id" ]] || continue
              run="$(jq -ec --argjson id "$run_id" \
                '.workflow_runs[] | select(.id == $id)' <<<"$runs")" || return 2
              jq -e \
                --arg sha "$RELEASE_COMMIT" \
                --arg path ".github/workflows/${workflow}" '
                  .repository.full_name == "instafy-dev/instafy" and
                  .path == $path and
                  .event == "workflow_dispatch" and
                  .head_branch == "main" and
                  .head_sha == $sha and
                  .status == "completed" and
                  .conclusion == "success"
                ' <<<"$run" >/dev/null || return 2
              artifacts="$(gh api --method GET \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
                -f per_page=100)" || return 2
              if ! jq -e '(.total_count | type) == "number" and
                .total_count == (.artifacts | length) and .total_count <= 100' <<<"$artifacts" >/dev/null; then
                echo "::error::Release run ${run_id} has an incomplete or unbounded artifact inventory." >&2
                return 2
              fi
              matches="$(jq -ec --arg name "$artifact_name" \
                '[.artifacts[] | select(.name == $name)]' <<<"$artifacts")" || return 2
              if [[ "$(jq -er 'length' <<<"$matches")" -gt 1 ]]; then
                echo "::error::Release run ${run_id} has duplicate ${artifact_name} artifacts." >&2
                return 2
              fi
              if [[ "$(jq -er 'length' <<<"$matches")" == "1" ]] &&
                 jq -e '
                   .[0].expired == false and
                   (. [0].digest | type) == "string" and
                   (. [0].digest | test("^sha256:[0-9a-f]{64}$")) and
                   (. [0].expires_at | type) == "string"
                 ' <<<"$matches" >/dev/null; then
                expires_at="$(jq -er '.[0].expires_at' <<<"$matches")" || return 2
                expires_epoch="$(date -u -d "$expires_at" +%s)" || return 2
                if [[ "$expires_epoch" -ge "$minimum_expiry_epoch" ]]; then
                  return 0
                fi
              fi
            done < <(jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' <<<"$runs")
            if jq -e 'any(.workflow_runs[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "::error::A sealed ${workflow} publication has no fresh manifest; immutable publication cannot be repeated." >&2
              return 2
            fi
            return 1
          }

          services_fresh=false
          services_publish=true
          pending=false
          if manifest_is_fresh \
            publish-production-services.yml \
            production-service-release-manifest; then
            services_fresh=true
            services_publish=false
          else
            status=$?
            case "$status" in
              1) ;;
              3) pending=true; services_publish=false ;;
              *) exit "$status" ;;
            esac
          fi
          runtime_fresh=false
          runtime_publish=true
          if manifest_is_fresh \
            publish-runtime-agent.yml \
            runtime-agent-release-manifest; then
            runtime_fresh=true
            runtime_publish=false
          else
            status=$?
            case "$status" in
              1) ;;
              3) pending=true; runtime_publish=false ;;
              *) exit "$status" ;;
            esac
          fi
          echo "services_publish=$services_publish" >> "$GITHUB_OUTPUT"
          echo "runtime_publish=$runtime_publish" >> "$GITHUB_OUTPUT"
          echo "runtime_fresh=$runtime_fresh" >> "$GITHUB_OUTPUT"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if [[ "$pending" == "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Publication deferred: an exact publisher is still active; no duplicate publishers dispatched." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$services_fresh" == "true" && "$runtime_fresh" == "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch missing immutable image publishers without waiting
        if: >-
          steps.recheck.outputs.current == 'true' &&
          steps.freshness.outputs.publish == 'true'
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit_sha }}
          PUBLISH_SERVICES: ${{ steps.freshness.outputs.services_publish }}
          PUBLISH_RUNTIME: ${{ steps.freshness.outputs.runtime_publish }}
        run: |
          set -euo pipefail
          current_main="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$current_main" != "$RELEASE_COMMIT" ]]; then
            echo "Publication deferred: protected main advanced before dispatch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dispatch() {
            local workflow="$1"
            local inputs="$2"
            gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              --input - <<JSON
          {"ref":"main","inputs":${inputs}}
          JSON
          }

          services_run_id=""
          services_url=""
          runtime_run_id=""
          runtime_url=""
          if [[ "$PUBLISH_SERVICES" == "true" ]]; then
            services="$(
              dispatch \
                publish-production-services.yml \
                "{\"commit_sha\":\"${RELEASE_COMMIT}\"}"
            )"
            services_run_id="$(jq -er '.workflow_run_id' <<<"$services")"
            services_url="$(jq -er '.html_url' <<<"$services")"
          fi
          if [[ "$PUBLISH_RUNTIME" == "true" ]]; then
            runtime="$(
              dispatch \
                publish-runtime-agent.yml \
                "{\"commit_sha\":\"${RELEASE_COMMIT}\"}"
            )"
            runtime_run_id="$(jq -er '.workflow_run_id' <<<"$runtime")"
            runtime_url="$(jq -er '.html_url' <<<"$runtime")"
          fi
          for run_id in "$services_run_id" "$runtime_run_id"; do
            [[ -n "$run_id" ]] || continue
            if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::GitHub did not return an exact child workflow run ID."
              exit 1
            fi
          done
          if [[ -n "$services_run_id" && "$services_run_id" == "$runtime_run_id" ]]; then
            echo "::error::The two image publishers returned the same run ID."
            exit 1
          fi
          {
            echo "services_run_id=$services_run_id"
            echo "runtime_run_id=$runtime_run_id"
            echo "services_url=$services_url"
            echo "runtime_url=$runtime_url"
            echo "dispatched=true"
          } >> "$GITHUB_OUTPUT"

      - name: Report requested immutable image publication
        if: ${{ steps.dispatch.outputs.dispatched == 'true' }}
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit_sha }}
          PUBLISH_SERVICES: ${{ steps.freshness.outputs.services_publish }}
          PUBLISH_RUNTIME: ${{ steps.freshness.outputs.runtime_publish }}
          SERVICES_RUN_ID: ${{ steps.dispatch.outputs.services_run_id }}
          SERVICES_URL: ${{ steps.dispatch.outputs.services_url }}
          RUNTIME_RUN_ID: ${{ steps.dispatch.outputs.runtime_run_id }}
          RUNTIME_URL: ${{ steps.dispatch.outputs.runtime_url }}
        run: |
          {
            echo "### Immutable image publication dispatched, not yet verified"
            echo
            echo "- Public core: \`${RELEASE_COMMIT}\`"
            if [[ "$PUBLISH_SERVICES" == "true" ]]; then
              echo "- Production services: [run ${SERVICES_RUN_ID}](${SERVICES_URL})"
            else
              echo "- Production services: retained the existing fresh manifest"
            fi
            if [[ "$PUBLISH_RUNTIME" == "true" ]]; then
              echo "- Runtime agent: [run ${RUNTIME_RUN_ID}](${RUNTIME_URL})"
            else
              echo "- Runtime agent: retained the existing fresh manifest"
            fi
            echo "- Mutable channel tags were not moved."
            echo "- Child publishers must still pass their build, scan and immutable manifest gates."
            echo "- A later reconciliation checks sealed manifests; this coordinator does not wait or certify publication."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report fresh immutable manifests
        if: >-
          steps.recheck.outputs.current == 'true' &&
          steps.freshness.outputs.publish == 'false' &&
          steps.freshness.outputs.pending == 'false'
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit_sha }}
        run: |
          {
            echo "### Immutable production images are fresh"
            echo
            echo "- Public core: \`$RELEASE_COMMIT\`"
            echo "- Both exact manifests remain live for at least 14 days, so no image was rebuilt or pushed."
          } >> "$GITHUB_STEP_SUMMARY"

      # The best-effort arm64 lane. Every production decision above is final
      # before this step starts, and nothing here feeds back into it: the lane
      # writes only multiarch_* outputs and runs in a subshell, and its script
      # always ends with status 0. The runner also bounds the step to two
      # minutes and lets the job continue past it, so a stalled API call cannot
      # fail a pass either: arm64 can warn but never fail a pass or block a
      # release. It acts only in a pass that found the production runtime
      # manifest sealed for this exact current main, and dispatches again after
      # a failure until the commit has reached the retry cap.
      - name: Reconcile the best-effort arm64 lane without blocking production
        if: >-
          steps.recheck.outputs.current == 'true' &&
          steps.freshness.outputs.runtime_fresh == 'true'
        id: multiarch
        timeout-minutes: 2
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit_sha }}
        run: |
          # Actions starts this shell with errexit; this outer part never exits
          # early. Only the subshell below fails fast, and its status is reported.
          set +e
          set -o pipefail
          lane_workflow=publish-runtime-agent-multiarch.yml
          lane_artifact=runtime-agent-multiarch-manifest
          production_workflow=publish-runtime-agent.yml
          retry_cap=4
          stuck_after_seconds=$(( 6 * 60 * 60 ))
          {
            echo "### Best-effort arm64 lane"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          (
            set -euo pipefail
            finish() {
              echo "multiarch_state=$1" >> "$GITHUB_OUTPUT"
              echo "- $2" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }
            now_epoch="$(date -u +%s)"
            minimum_expiry_epoch="$(( now_epoch + 14 * 24 * 60 * 60 ))"
            runs="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${lane_workflow}/runs" \
              -f head_sha="$RELEASE_COMMIT" \
              -f per_page=100)"
            jq -e --arg sha "$RELEASE_COMMIT" --arg path ".github/workflows/${lane_workflow}" '
              (.total_count | type) == "number" and
              .total_count == (.workflow_runs | length) and .total_count <= 100 and
              ([.workflow_runs[].id] | unique | length) == .total_count and
              all(.workflow_runs[];
                (.id | type) == "number" and .id > 0 and .id == (.id | floor) and
                .repository.full_name == "instafy-dev/instafy" and .path == $path and
                .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and
                (.status | IN("completed", "queued", "in_progress", "waiting", "pending", "requested")))
            ' <<<"$runs" >/dev/null
            if jq -e 'any(.workflow_runs[]; .status != "completed")' <<<"$runs" >/dev/null; then
              # An approval that nobody gives, or a queue behind another
              # commit's run, would otherwise stay silent for days.
              oldest_active="$(jq -r '
                [.workflow_runs[] | select(.status != "completed") | .created_at | strings] |
                sort | first // empty
              ' <<<"$runs")"
              if [[ -n "$oldest_active" ]]; then
                active_since="$(date -u -d "$oldest_active" +%s)"
                if (( now_epoch - active_since >= stuck_after_seconds )); then
                  echo "::warning::A ${lane_workflow} run for ${RELEASE_COMMIT} has been active since ${oldest_active}; it may be waiting for ghcr-release approval or queued behind another run. Production publication is unaffected."
                fi
              fi
              finish pending "A ${lane_workflow} run for \`${RELEASE_COMMIT}\` is still active; none was dispatched."
            fi
            sealed_runs="$(jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' <<<"$runs")"
            if [[ -n "$sealed_runs" ]]; then
              while read -r run_id; do
                artifacts="$(gh api --method GET \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2026-03-10' \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
                  -f per_page=100)"
                jq -e '(.total_count | type) == "number" and
                  .total_count == (.artifacts | length) and .total_count <= 100' <<<"$artifacts" >/dev/null
                matches="$(jq -c --arg name "$lane_artifact" '[.artifacts[] | select(.name == $name)]' <<<"$artifacts")"
                if jq -e '
                    length == 1 and
                    .[0].expired == false and
                    (.[0].digest | type) == "string" and
                    (.[0].digest | test("^sha256:[0-9a-f]{64}$")) and
                    (.[0].expires_at | type) == "string"
                  ' <<<"$matches" >/dev/null &&
                   [[ "$(date -u -d "$(jq -er '.[0].expires_at' <<<"$matches")" +%s)" -ge "$minimum_expiry_epoch" ]]; then
                  finish fresh "Multi-arch images for \`${RELEASE_COMMIT}\` are sealed (run ${run_id})."
                fi
              done <<<"$sealed_runs"
              echo "::warning::A sealed ${lane_workflow} run for ${RELEASE_COMMIT} has no fresh ${lane_artifact}; it cannot be repeated automatically. Production publication is unaffected."
              finish stale "Sealed, but its ${lane_artifact} is missing or expiring; not repeated. Production publication is unaffected."
            fi
            failed="$(jq -er '[.workflow_runs[] | select(.conclusion != "success")] | length' <<<"$runs")"
            if (( failed >= retry_cap )); then
              echo "::warning::arm64 lane exhausted for ${RELEASE_COMMIT} after ${failed} failed runs (cap ${retry_cap}); production unaffected; dispatch ${lane_workflow} manually once the cause is fixed."
              finish exhausted "arm64 lane exhausted for \`${RELEASE_COMMIT}\`; production unaffected; dispatch \`${lane_workflow}\` manually."
            fi
            # The arm64 workflow binds only to exactly one successful
            # first-attempt production run, as release consumers do. A seal
            # from any other attempt (for example after re-running failed jobs)
            # can never bind, so it is reported instead of spending the cap.
            production_runs="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${production_workflow}/runs" \
              -f head_sha="$RELEASE_COMMIT" \
              -f per_page=100)"
            jq -e '(.total_count | type) == "number" and
              .total_count == (.workflow_runs | length) and .total_count <= 100' <<<"$production_runs" >/dev/null
            bindable="$(jq -er --arg sha "$RELEASE_COMMIT" --arg path ".github/workflows/${production_workflow}" '
              [.workflow_runs[] | select(
                .repository.full_name == "instafy-dev/instafy" and .path == $path and
                .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == $sha and
                .status == "completed" and .conclusion == "success" and .run_attempt == 1
              )] | length
            ' <<<"$production_runs")"
            if [[ "$bindable" != "1" ]]; then
              echo "::warning::The sealed ${production_workflow} release for ${RELEASE_COMMIT} is not exactly one successful first-attempt run, so the arm64 lane cannot bind to it; none was dispatched. Production publication is unaffected."
              finish unbindable "Not dispatched: the production runtime release for \`${RELEASE_COMMIT}\` is not exactly one successful first-attempt run."
            fi
            current_main="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            if [[ "$current_main" != "$RELEASE_COMMIT" ]]; then
              finish deferred "Protected main advanced before dispatch; the newer commit's passes own its arm64 lane."
            fi
            receipt="$(gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${lane_workflow}/dispatches" \
              --input - <<JSON
          {"ref":"main","inputs":{"commit_sha":"${RELEASE_COMMIT}","update_channel_tags":false}}
          JSON
            )"
            run_id="$(jq -er '.workflow_run_id' <<<"$receipt")"
            run_url="$(jq -er '.html_url' <<<"$receipt")"
            if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "GitHub did not return an exact arm64 lane run ID." >&2
              exit 1
            fi
            echo "multiarch_run_id=$run_id" >> "$GITHUB_OUTPUT"
            finish dispatched "Dispatched attempt $(( failed + 1 )) of ${retry_cap}: [run ${run_id}](${run_url}), not yet verified."
          )
          status=$?
          if [[ "$status" != "0" ]]; then
            echo "::warning::The arm64 lane could not be reconciled in this pass (status ${status}). Production publication is unaffected; the next pass retries."
            echo "multiarch_state=error" >> "$GITHUB_OUTPUT"
            echo "- Not reconciled in this pass (status ${status}); production publication is unaffected." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
