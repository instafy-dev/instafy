name: Trusted Public Boundary

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

concurrency:
  group: trusted-public-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # The wait step polls the pulls API; the workflow token needs the explicit
  # pull-requests scope for that (contents alone 403s, which once burned the
  # whole poll budget on every pull request).
  pull-requests: read

jobs:
  boundary:
    name: Public boundary (trusted base)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Wait for the event-bound merge candidate to be minted
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # Read-only: watches the pulls API until the server-minted merge
          # candidate binds this event's head and real base history. Never
          # fetches candidate code.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_REF" == "main" ]]
          # refs/pull/N/merge is minted asynchronously. After a push — and
          # especially after a long-unmergeable spell or a stacked-branch
          # retarget — the ref can lag this event by minutes. The head parent
          # can already match while the base parent still names the previous
          # target, as observed on PR #125 after issue #99's head-only wait.
          # A checkout taken then fails the later parent verification even
          # though GitHub is still re-minting the candidate. Polling the
          # read-only pulls API also schedules the recompute, so this loop
          # waits for both the exact event head and genuine target-branch
          # history. Only the wait moves here: the checkout still binds
          # nothing, and the verification step below remains the enforced
          # security property.
          candidate_oid=""
          for attempt in $(seq 1 32); do
            if [[ "$attempt" -gt 1 ]]; then
              sleep 15
            fi
            if ! api_body="$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                --jq '.merge_commit_sha // empty' 2>/dev/null
            )"; then
              # The wait is availability-only; the parent verification below is
              # the enforced property. An inaccessible pulls API (permissions
              # regression, API outage) must not brick the check — skip the
              # wait loudly rather than failing every pull request.
              echo "::warning::pulls API not accessible from this token;" \
                "skipping the merge-candidate wait (attempt ${attempt})."
              exit 0
            fi
            candidate_oid="$api_body"
            if [[ "$candidate_oid" =~ ^[0-9a-f]{40}$ ]]; then
              parent_pair="$(
                gh api "repos/${GITHUB_REPOSITORY}/git/commits/${candidate_oid}" \
                  --jq 'if (.parents | length) == 2 then [.parents[0].sha, .parents[1].sha] | @tsv else empty end' \
                  2>/dev/null || true
              )"
              base_parent=""
              head_parent=""
              IFS=$'\t' read -r base_parent head_parent <<< "$parent_pair" || true
              if [[ "$head_parent" != "$EXPECTED_HEAD_SHA" ]]; then
                continue
              fi
              if [[ ! "$base_parent" =~ ^[0-9a-f]{40}$ ]]; then
                continue
              fi
              if [[ "$base_parent" == "$EXPECTED_BASE_SHA" ]]; then
                exit 0
              fi
              base_relation="$(
                gh api \
                  "repos/${GITHUB_REPOSITORY}/compare/${base_parent}...${BASE_REF}" \
                  --jq '.status // empty' 2>/dev/null || true
              )"
              case "$base_relation" in
                identical|ahead)
                  exit 0
                  ;;
                behind|diverged)
                  continue
                  ;;
                *)
                  continue
                  ;;
              esac
            fi
          done
          echo "::error::No merge candidate bound to head ${EXPECTED_HEAD_SHA}" \
            "and ${BASE_REF} history" \
            "after 8 minutes (last candidate: ${candidate_oid:-none}). Either" \
            "the pull request is unmergeable right now, or GitHub's" \
            "mergeability job is delayed — re-run this check once the pull" \
            "request page shows a mergeability result."
          exit 1

      - name: Checkout trusted base controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          set-safe-directory: false
          show-progress: false

      - name: Checkout server-generated merge candidate as data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: candidate
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          # Deliberate checkout v6 exception: candidate bytes remain unexecuted data.
          allow-unsafe-pr-checkout: true
          set-safe-directory: false
          show-progress: false

      - name: Verify the event-bound merge object and parents
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # Read-only: resolves whether the merge candidate's base parent is
          # contained in the base branch. Never used to fetch candidate code.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The bindings below are deliberately bare assertions; the trap
          # names the failing command so a rejection is diagnosable instead
          # of a silent exit (issue #99).
          trap 'echo "::error::merge object verification failed on: ${BASH_COMMAND}"' ERR
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_merge_sha="$(
            git -C "$CANDIDATE_ROOT" rev-parse --verify "HEAD^{commit}"
          )"
          [[ "$actual_merge_sha" =~ ^[0-9a-f]{40}$ ]]
          # Pretty-format parent expansion hides parents at a shallow boundary.
          # Parse only the raw commit header block, never its untrusted message.
          mapfile -t parent_shas < <(
            git -C "$CANDIDATE_ROOT" cat-file commit "$actual_merge_sha" |
              sed -n '/^$/q; s/^parent //p'
          )
          test "${#parent_shas[@]}" -eq 2
          # The head parent is bound exactly: this is what proves the candidate
          # contains this pull request's code and nothing else.
          test "${parent_shas[1]}" = "$EXPECTED_HEAD_SHA"
          # The base parent is bound to real base-branch history rather than to
          # the event payload's base.sha. GitHub freezes that field, so once the
          # base branch advances every later merge candidate is minted against
          # the newer tip and an exact comparison can never succeed again — the
          # pull request becomes permanently unmergeable and has to be recreated.
          # Requiring the base parent to be contained in the base branch keeps
          # the property that matters (the merge is against genuine repository
          # history, not a base an author supplied) while letting the branch move.
          if [ "${parent_shas[0]}" = "$EXPECTED_BASE_SHA" ]; then
            base_relation=identical
          else
            base_relation="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${parent_shas[0]}...${BASE_REF}" \
                --jq '.status'
            )"
          fi
          case "$base_relation" in
            identical|ahead)
              # identical: the base parent is the current branch tip.
              # ahead: the branch has moved on, so the parent is an ancestor.
              # Anything else — behind or diverged — means the base parent is
              # not contained in the branch and must be rejected.
              ;;
            *)
              echo "::error::Merge candidate base parent ${parent_shas[0]} is not part of ${BASE_REF} history (${base_relation})."
              exit 1
              ;;
          esac
          # The parents binding above is the security property: the candidate
          # is a server-minted merge of exactly the event's base and head, so
          # base-owned tooling scans exactly this PR's content. Do NOT also
          # require actual_merge_sha == the event's merge_commit_sha: GitHub
          # re-mints refs/pull/N/merge lazily (same parents, fresh committer
          # timestamp => new OID) between event delivery and checkout, so that
          # equality fails on timing alone (observed 4/4 on PR #11). When the
          # payload OID happens to match, note it; a mismatch with correct
          # parents is the documented benign re-mint.
          if [[ -n "$EXPECTED_MERGE_SHA" ]]; then
            [[ "$EXPECTED_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$actual_merge_sha" != "$EXPECTED_MERGE_SHA" ]]; then
              echo "::notice::Merge ref re-minted after event delivery" \
                "(payload ${EXPECTED_MERGE_SHA}, checked out ${actual_merge_sha});" \
                "parents verified against the exact event base and head."
            fi
          fi

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          test "$("$RUNNER_TEMP/gitleaks" version)" = "$GITLEAKS_VERSION"

      - name: Run trusted public boundary regression tests
        env:
          TRUSTED_ROOT: ${{ github.workspace }}/trusted
        run: |
          set -euo pipefail
          node --test \
            "$TRUSTED_ROOT/scripts/check-public-boundary.test.mjs" \
            "$TRUSTED_ROOT/scripts/check-public-boundary-workflow.test.mjs"

      - name: Enforce trusted public boundary policy
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          TRUSTED_ROOT: ${{ github.workspace }}/trusted
        run: |
          set -euo pipefail
          node "$TRUSTED_ROOT/scripts/check-public-boundary.mjs" \
            --root "$CANDIDATE_ROOT" \
            --policy "$TRUSTED_ROOT/scripts/public-boundary-policy.json"

      - name: Create isolated Gitleaks ignore input
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/gitleaks-public-boundary.empty-ignore"

      - name: Prove encoded private marker detection
        env:
          TRUSTED_ROOT: ${{ github.workspace }}/trusted
        run: |
          set -euo pipefail
          encoded_private_marker="$(
            printf '%s' 'inter''nal.instafy.dev' | base64 | tr -d '\n'
          )"
          if printf '%s\n' "$encoded_private_marker" |
            "$RUNNER_TEMP/gitleaks" stdin \
              --config "$TRUSTED_ROOT/scripts/public-boundary-gitleaks.toml" \
              --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-public-boundary.empty-ignore" \
              --ignore-gitleaks-allow \
              --log-level=error \
              --max-decode-depth=3 \
              --no-banner \
              --no-color \
              --redact=100; then
            printf '%s\n' "Gitleaks accepted an encoded private marker"
            exit 1
          fi

      - name: Scan candidate tree with path-aware Gitleaks rules
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          TRUSTED_ROOT: ${{ github.workspace }}/trusted
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir \
            --config "$TRUSTED_ROOT/scripts/public-boundary-gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-public-boundary.empty-ignore" \
            --ignore-gitleaks-allow \
            --log-level=error \
            --max-archive-depth=1 \
            --max-decode-depth=3 \
            --max-target-megabytes=0 \
            --no-banner \
            --no-color \
            --redact=100 \
            --timeout=110 \
            "$CANDIDATE_ROOT"

      - name: Scan every tracked file without path allowlists
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          TRUSTED_ROOT: ${{ github.workspace }}/trusted
        run: |
          set -euo pipefail
          candidate_inventory="$RUNNER_TEMP/public-boundary-candidate-files.zlist"
          git -C "$CANDIDATE_ROOT" ls-files --cached -z > "$candidate_inventory"
          test -s "$candidate_inventory"
          while IFS= read -r -d '' relative_path; do
            candidate_file="$CANDIDATE_ROOT/$relative_path"
            if [[ -f "$candidate_file" && ! -L "$candidate_file" ]]; then
              cat -- "$candidate_file"
              printf '\n'
            fi
          done < "$candidate_inventory" |
            (
              cd "$TRUSTED_ROOT"
              "$RUNNER_TEMP/gitleaks" stdin \
                --config scripts/public-boundary-gitleaks-stream.toml \
                --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-public-boundary.empty-ignore" \
                --ignore-gitleaks-allow \
                --log-level=error \
                --max-archive-depth=1 \
                --max-decode-depth=3 \
                --max-target-megabytes=0 \
                --no-banner \
                --no-color \
                --redact=100 \
                --timeout=110
            )
