name: Public Git Conflict Contract

on:
  pull_request:
    paths:
      - ".github/workflows/git-conflict-canary.yml"
      - "scripts/check-git-conflict-ci.test.mjs"
      - "packages/runtime-agent/assets/instafy/.agents/skills/instafy-git-canonical-conflicts/SKILL.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/git-conflict-canary.yml"
      - "scripts/check-git-conflict-ci.test.mjs"
      - "packages/runtime-agent/assets/instafy/.agents/skills/instafy-git-canonical-conflicts/SKILL.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-git-conflict-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-conflict:
    name: Deterministic conflict fixture
    runs-on: >-
      ${{ vars.CI_GIT_CONFLICT_SELF_HOSTED == 'true'
          && github.repository == 'instafy-dev/instafy'
          && github.event.repository.private == true
          && ((github.event_name == 'pull_request'
            && github.event.pull_request.base.ref == 'main'
            && github.event.pull_request.base.repo.full_name == github.repository
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.head.repo.fork == false)
          || (github.event_name == 'push'
            && github.ref == 'refs/heads/main'
            && github.ref_protected == true))
          && fromJSON(format('{{"group":"org/instafy-ci-{0}","labels":["self-hosted","Linux","ARM64","instafy-ci-bootstrap-{1}-{2}-{3}-deterministic-conflict","instafy-ci-trust-{0}"]}}', github.event_name == 'pull_request' && 'pr' || 'main', github.repository_id, github.run_id, github.run_attempt))
          || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Qualify isolated Git conflict runner
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          assert.ok(Number.isSafeInteger(process.getuid()) && process.getuid() > 0);
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(process.env.RUNNER_OS, 'Linux');
          assert.equal(process.env.RUNNER_ARCH, 'ARM64');
          assert.equal(process.env.INSTAFY_CI_JOB_ISOLATION, 'ephemeral');
          assert.ok(!process.env.INSTAFY_ENV_DIR);
          for (const tool of ['bash', 'git', 'curl', 'tar', 'sha256sum', 'unzip', 'grep', 'mktemp', 'rm']) {
            execFileSync('/bin/bash', ['-c', 'command -v "$1" >/dev/null', 'git-conflict-preflight', tool], { timeout: 1000, stdio: 'ignore' });
          }
          NODE

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test Git conflict routing contracts
        run: node --test scripts/check-git-conflict-ci.test.mjs

      - name: Verify conflict-resolution fixture
        shell: bash
        run: |
          set -euo pipefail

          skill_path="packages/runtime-agent/assets/instafy/.agents/skills/instafy-git-canonical-conflicts/SKILL.md"
          test -s "$skill_path"
          grep -Fq "git rebase" "$skill_path"
          grep -Fq "git rebase --continue" "$skill_path"
          grep -Fq "git push" "$skill_path"

          fixture_root="$(mktemp -d)"
          trap 'rm -rf "$fixture_root"' EXIT

          git init --bare --initial-branch=main "$fixture_root/remote.git"
          git clone "$fixture_root/remote.git" "$fixture_root/local"
          git -C "$fixture_root/local" config user.name "Instafy fixture"
          git -C "$fixture_root/local" config user.email "fixture@example.invalid"
          printf '%s\n' "TODO: milk" > "$fixture_root/local/todo.txt"
          git -C "$fixture_root/local" add todo.txt
          git -C "$fixture_root/local" commit -m "fixture: base"
          git -C "$fixture_root/local" push origin main

          git clone "$fixture_root/remote.git" "$fixture_root/remote-writer"
          git -C "$fixture_root/remote-writer" config user.name "Instafy fixture"
          git -C "$fixture_root/remote-writer" config user.email "fixture@example.invalid"

          printf '%s\n' "TODO: milk + eggs" > "$fixture_root/local/todo.txt"
          git -C "$fixture_root/local" add todo.txt
          git -C "$fixture_root/local" commit -m "fixture: local"

          printf '%s\n' "TODO: milk + bread" > "$fixture_root/remote-writer/todo.txt"
          git -C "$fixture_root/remote-writer" add todo.txt
          git -C "$fixture_root/remote-writer" commit -m "fixture: remote"
          git -C "$fixture_root/remote-writer" push origin main

          git -C "$fixture_root/local" fetch origin main
          if git -C "$fixture_root/local" rebase origin/main; then
            echo "expected the deterministic fixture to conflict" >&2
            exit 1
          fi

          test -f "$fixture_root/local/.git/rebase-merge/git-rebase-todo" ||
            test -f "$fixture_root/local/.git/rebase-apply/applying"
          grep -Fq "<<<<<<<" "$fixture_root/local/todo.txt"

          printf '%s\n' "TODO: milk + bread + eggs" > "$fixture_root/local/todo.txt"
          git -C "$fixture_root/local" add todo.txt
          GIT_EDITOR=true git -C "$fixture_root/local" rebase --continue
          git -C "$fixture_root/local" push origin HEAD:main

          resolved="$(git --git-dir="$fixture_root/remote.git" show main:todo.txt)"
          test "$resolved" = "TODO: milk + bread + eggs"
