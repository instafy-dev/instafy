name: Publish Provider Contract

on:
  pull_request:
    paths:
      - ".github/workflows/publish-provider-contract.yml"
      - "packages/provider-contract/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-provider-contract.yml"
      - "packages/provider-contract/**"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA; must equal current protected main
        required: true
        type: string
      publish:
        description: Actually publish to npm (otherwise validate package contents only)
        required: false
        default: false
        type: boolean
      dist_tag:
        description: npm dist-tag
        required: false
        default: latest
        type: string
      skip_duplicate:
        description: Skip publish if this exact version already exists on npm
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize exact release source
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}

    steps:
      - name: Bind validation or release to the event commit
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not provide a full lowercase commit SHA."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Publishing may be dispatched only from protected main."
              exit 1
            fi
            if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::commit_sha must be a full lowercase commit SHA."
              exit 1
            fi
            if [[ "$REQUESTED_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::commit_sha must equal current protected main."
              exit 1
            fi
          fi
          echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate @instafy/provider-contract
    needs: authorize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit_sha }}
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Validate package contents
        run: |
          set -euo pipefail
          cd packages/provider-contract
          npm pack --dry-run --ignore-scripts

  publish-provider-contract:
    name: Publish @instafy/provider-contract
    needs:
      - authorize
      - validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    environment: npm-release
    env:
      DIST_TAG: ${{ inputs.dist_tag }}
      SKIP_DUPLICATE: ${{ inputs.skip_duplicate }}

    steps:
      - name: Checkout exact protected-main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit_sha }}
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing NPM_TOKEN secret."
            exit 1
          fi
          if [[ ! "$DIST_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
            echo "::error::dist_tag is invalid."
            exit 1
          fi

          cd packages/provider-contract
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          if [ "${SKIP_DUPLICATE}" = "true" ]; then
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Already published ${name}@${version}; skipping."
              exit 0
            fi
          fi

          npm publish --tag "${DIST_TAG}" --access public
