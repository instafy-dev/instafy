name: Publish runtime-agent images

# The production runtime release. It builds, scans and publishes the base and
# webdev images for linux/amd64 only, and seals runtime-agent-release-manifest
# with their scanned single-platform digests. Every production host is amd64,
# so arm64 never gates a release: publish-runtime-agent-multiarch.yml adds the
# arm64 images, the multi-arch commit tags and the channel tags afterwards,
# bound to this run's sealed manifest.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA; must equal current protected main"
        required: true
        type: string
      # Kept so existing dispatchers stay valid. This publisher creates no
      # multi-arch index, so it refuses true: the channel tags move only in
      # publish-runtime-agent-multiarch.yml.
      update_channel_tags:
        description: "Must stay false; channel tags move in publish-runtime-agent-multiarch.yml"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-runtime-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact release source
    runs-on: >-
      ${{ vars.TRUSTED_AMD64_BUILD_RUNNER_MODE == 'self-hosted'
          && github.repository == 'instafy-dev/instafy'
          && github.repository_id == '1309636737'
          && github.event.repository.private == true
          && github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && github.ref_protected == true
          && github.workflow_ref == 'instafy-dev/instafy/.github/workflows/publish-runtime-agent.yml@refs/heads/main'
          && github.workflow_sha == github.sha
          && inputs.commit_sha == github.sha
          && fromJSON('{"group":"org/instafy-trusted-build","labels":["self-hosted","Linux","X64","instafy-build"]}')
          || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}

    steps:
      - name: Bind release to current protected main
        id: release
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.commit_sha }}
          UPDATE_CHANNEL_TAGS: ${{ inputs.update_channel_tags }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "instafy-dev/instafy" ]]; then
            echo "::error::Runtime images may be published only from instafy-dev/instafy."
            exit 1
          fi
          if [[ "$UPDATE_CHANNEL_TAGS" == "true" ]]; then
            echo "::error::This publisher releases amd64 images only and no longer moves the latest/webdev channel tags. Dispatch publish-runtime-agent-multiarch.yml with update_channel_tags=true once this release is sealed."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Runtime publication may run only from protected main."
            exit 1
          fi
          if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be a full lowercase commit SHA."
            exit 1
          fi
          if [[ "$REQUESTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::commit_sha must equal current protected main."
            exit 1
          fi
          echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Refuse duplicate exact-SHA publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit_sha }}
          RELEASE_WORKFLOW: publish-runtime-agent.yml
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "::error::Release runs are immutable; use a fresh dispatch after a failed attempt."
            exit 1
          fi
          runs="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${RELEASE_WORKFLOW}/runs" \
            -f event=workflow_dispatch \
            -f head_sha="$RELEASE_COMMIT" \
            -f status=success \
            -f per_page=100)"
          if [[ "$(jq -er '.total_count' <<<"$runs")" -gt 100 ]]; then
            echo "::error::Exact release history is unbounded."
            exit 1
          fi
          sealed_count="$(jq -er \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg path ".github/workflows/${RELEASE_WORKFLOW}" \
            --arg sha "$RELEASE_COMMIT" '
              [.workflow_runs[] | select(
                .repository.full_name == $repository and
                .path == $path and
                .event == "workflow_dispatch" and
                .head_branch == "main" and
                .head_sha == $sha and
                .status == "completed" and
                .conclusion == "success"
              )] | length
            ' <<<"$runs")"
          if [[ "$sealed_count" != "0" ]]; then
            echo "::error::This exact protected-main release already has a sealed successful publication."
            exit 1
          fi

  release-approval:
    name: Approve the exact release once
    needs: authorize
    runs-on: >-
      ${{ vars.TRUSTED_AMD64_BUILD_RUNNER_MODE == 'self-hosted'
          && github.repository == 'instafy-dev/instafy'
          && github.repository_id == '1309636737'
          && github.event.repository.private == true
          && github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && github.ref_protected == true
          && github.workflow_ref == 'instafy-dev/instafy/.github/workflows/publish-runtime-agent.yml@refs/heads/main'
          && github.workflow_sha == github.sha
          && inputs.commit_sha == github.sha
          && fromJSON('{"group":"org/instafy-trusted-build","labels":["self-hosted","Linux","X64","instafy-build"]}')
          || 'ubuntu-latest' }}
    environment: ghcr-release
    permissions: {}
    steps:
      - name: Record the approved release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.authorize.outputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to approve a release without an exact commit."
            exit 1
          fi
          {
            echo "### ghcr-release approval"
            echo
            echo "- Approved runtime-agent release for public core \`${RELEASE_COMMIT}\`."
            echo "- This single approval covers both amd64 flavor cells below."
          } >> "$GITHUB_STEP_SUMMARY"

  build-scan-push:
    name: Publish ${{ matrix.flavor }} ${{ matrix.architecture }} runtime
    needs:
      - authorize
      - release-approval
    runs-on: >-
      ${{ vars.TRUSTED_AMD64_BUILD_RUNNER_MODE == 'self-hosted'
          && github.repository == 'instafy-dev/instafy'
          && github.repository_id == '1309636737'
          && github.event.repository.private == true
          && github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && github.ref_protected == true
          && github.workflow_ref == 'instafy-dev/instafy/.github/workflows/publish-runtime-agent.yml@refs/heads/main'
          && github.workflow_sha == github.sha
          && inputs.commit_sha == github.sha
          && fromJSON('{"group":"org/instafy-trusted-build","labels":["self-hosted","Linux","X64","instafy-build"]}')
          || matrix.runner }}
    # Cache-hit cells normally finish in under 15 minutes, but observed cold
    # Rust rebuilds can approach an hour. Keep a bounded 75-minute path while
    # still preventing a wedged BuildKit worker from consuming six hours. The
    # extra 16 minutes cover the layer cache export's own bound, so a slow
    # export cannot time out a cell that has already published its image.
    timeout-minutes: 91
    permissions:
      contents: read
      packages: write
    strategy:
      # fail-fast off: a failing cell must not cancel its sibling mid-push and
      # strand an arch tag; the assemble job's exact-fileset validation is the
      # single aggregation gate (matches the production-services choice).
      # Only amd64: the arm64 cells run in publish-runtime-agent-multiarch.yml.
      fail-fast: false
      matrix:
        include:
          - flavor: base
            target: runtime
            tag_prefix: ""
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            trivy_asset: Linux-64bit
            trivy_sha256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
          - flavor: webdev
            target: runtime-webdev
            tag_prefix: "webdev-"
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            trivy_asset: Linux-64bit
            trivy_sha256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"

    steps:
      - name: Checkout exact protected-main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit_sha }}
          submodules: recursive

      - name: Reclaim hosted-runner disk for the audited image
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          # Standard hosted runners expose limited free storage. These fixed
          # preinstalled SDK paths are unrelated to this Docker-only job and
          # otherwise crowd out the audited image; on runner images where a
          # path does not exist the removal is a harmless no-op.
          sudo rm -rf -- \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/share/dotnet

      - name: Require sufficient free disk for the audited image
        shell: bash
        run: |
          set -euo pipefail
          available_kib="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          echo "Free disk for image build: ${available_kib} KiB"
          # Canonical bounded decimal avoids Bash octal parsing and integer overflow.
          if [[ ! "$available_kib" =~ ^(0|[1-9][0-9]{0,17})$ ]] ||
            (( available_kib < 20 * 1024 * 1024 )); then
            echo "::error::Runtime image publication requires at least 20 GiB of free disk (have ${available_kib} KiB)."
            exit 1
          fi

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.35.0
          # Only x86 targets need the amd64 BuildKit v0.32.2 image on BUILD.
          # Keep ARM targets and hosted builders native; never force ARM via QEMU.
          driver-opts: ${{ runner.environment == 'self-hosted' && matrix.architecture == 'amd64' && 'image=moby/buildkit@sha256:040d34121c27906c4ff9ac152a30d52bf2c5d328d3bb748916bb3d2743c02528' || '' }}

      - name: Resolve image references
        id: refs
        shell: bash
        env:
          IMAGE_NAMESPACE: instafy-dev
          RELEASE_COMMIT: ${{ needs.authorize.outputs.commit_sha }}
          TAG_PREFIX: ${{ matrix.tag_prefix }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_NAMESPACE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::The fixed image namespace must be a lowercase GHCR namespace."
            exit 1
          fi
          if [[ "$ARCHITECTURE" != "amd64" ]]; then
            echo "::error::The production runtime publisher builds amd64 only."
            exit 1
          fi

          image="ghcr.io/${IMAGE_NAMESPACE}/instafy-runtime-agent"
          arch_tag="${image}:${TAG_PREFIX}${RELEASE_COMMIT}-linux-${ARCHITECTURE}"

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "arch_tag=$arch_tag" >> "$GITHUB_OUTPUT"

      - name: Install pinned Trivy
        env:
          TRIVY_VERSION: "0.72.0"
          TRIVY_ASSET: ${{ runner.environment == 'self-hosted' && 'Linux-64bit' || matrix.trivy_asset }}
          TRIVY_SHA256: ${{ runner.environment == 'self-hosted' && 'bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea' || matrix.trivy_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${TRIVY_ASSET}.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          sudo install -m 0755 "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
          test "$(trivy --version | awk 'NR == 1 { print $2 }')" = "$TRIVY_VERSION"

      # Hosted cells build natively; the trusted BUILD daemon must support the
      # amd64 target platform. Scan each image before any registry login.
      # This exact local image is pushed after the gate; there is no post-scan
      # rebuild that could change bytes.
      # The layer cache is only read here, anonymously, so this build needs no
      # registry credentials; it is written after publication, below. The final
      # stage (the matrix target) never comes from the cache, so its OS and npm
      # packages are current when the scan runs.
      - name: Build audit image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/runtime/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_PROFILE=release
            BUILD_ARTIFACT_DIR=release
          labels: |
            org.opencontainers.image.source=https://github.com/instafy-dev/instafy
            org.opencontainers.image.revision=${{ needs.authorize.outputs.commit_sha }}
            org.opencontainers.image.version=${{ needs.authorize.outputs.commit_sha }}
          cache-from: type=registry,ref=ghcr.io/instafy-dev/instafy-build-cache:publish-runtime-agent-${{ matrix.flavor }}-${{ matrix.architecture }}
          no-cache-filters: ${{ matrix.target }}
          tags: instafy-runtime-audit:${{ matrix.flavor }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
          load: true
          push: false
          provenance: false
          sbom: false

      - name: Scan audit image
        env:
          AUDIT_IMAGE: instafy-runtime-audit:${{ matrix.flavor }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
        run: |
          set -euo pipefail
          empty_config="$RUNNER_TEMP/trivy.empty.yaml"
          empty_ignore="$RUNNER_TEMP/trivy.empty-ignore"
          printf '{}\n' > "$empty_config"
          : > "$empty_ignore"
          trivy image \
            --config "$empty_config" \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile "$empty_ignore" \
            --exit-code 1 \
            --skip-version-check \
            --no-progress \
            "$AUDIT_IMAGE"

      # A webdev image must start headed Chromium before it may be published:
      # the Shared Browser depends on it and nothing downstream would notice.
      - name: Prove the webdev image starts the Shared Browser
        if: ${{ matrix.flavor == 'webdev' }}
        env:
          BROWSER_SMOKE_IMAGE: instafy-runtime-audit:${{ matrix.flavor }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
        run: bash scripts/runtime-image-browser-smoke.sh "$BROWSER_SMOKE_IMAGE"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image and record its digest
        shell: bash
        env:
          AUDIT_IMAGE: instafy-runtime-audit:${{ matrix.flavor }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
          ARCH_TAG: ${{ steps.refs.outputs.arch_tag }}
          IMAGE: ${{ steps.refs.outputs.image }}
          RELEASE_COMMIT: ${{ needs.authorize.outputs.commit_sha }}
          FLAVOR: ${{ matrix.flavor }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_REF_DIR: ${{ runner.temp }}/runtime-agent-arch-ref
        run: |
          set -euo pipefail
          docker tag "$AUDIT_IMAGE" "$ARCH_TAG"
          push_log="$RUNNER_TEMP/runtime-${FLAVOR}-${ARCHITECTURE}-push.log"
          # GHCR can transiently reject a content-addressed push after accepting
          # some layers. Retry only this already-scanned local image; never rebuild.
          push_succeeded=false
          for attempt in 1 2 3 4; do
            attempt_log="${push_log}.attempt-${attempt}"
            if docker push "$ARCH_TAG" 2>&1 | tee "$attempt_log"; then
              mv "$attempt_log" "$push_log"
              push_succeeded=true
              break
            fi
            terminal_error="$(
              tr -d '\r' < "$attempt_log" |
                awk 'NF { terminal = $0 } END { print terminal }'
            )"
            if [[ "$terminal_error" != "unknown blob" ]]; then
              echo "::error::GHCR push failed with a non-retryable response."
              exit 1
            fi
            if [[ "$attempt" != "4" ]]; then
              delay_seconds=$((attempt * 5))
              echo "::warning::GHCR returned the retryable unknown-blob response on attempt ${attempt}; retrying the same scanned image in ${delay_seconds}s."
              sleep "$delay_seconds"
            fi
          done
          if [[ "$push_succeeded" != "true" ]]; then
            echo "::error::GHCR rejected all bounded attempts to push the scanned image."
            exit 1
          fi
          digest="$(
            node scripts/lib/dockerPushDigest.mjs "$push_log"
          )"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Docker push did not return a valid immutable digest."
            exit 1
          fi
          immutable_ref="${IMAGE}@${digest}"
          # A successful push can precede digest visibility by a few seconds.
          registry_visible=false
          for attempt in 1 2 3 4 5 6; do
            if docker buildx imagetools inspect "$immutable_ref" >/dev/null; then
              registry_visible=true
              break
            fi
            if [[ "$attempt" != "6" ]]; then
              delay_seconds=$((1 << attempt))
              echo "::warning::GHCR has not exposed ${immutable_ref} yet; retrying in ${delay_seconds}s."
              sleep "$delay_seconds"
            fi
          done
          if [[ "$registry_visible" != "true" ]]; then
            echo "::error::GHCR did not expose the pushed immutable image within the bounded visibility window."
            exit 1
          fi
          mkdir -p "$RELEASE_REF_DIR"
          IMMUTABLE_REF="$immutable_ref" node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const {
            ARCHITECTURE,
            ARCH_TAG,
            FLAVOR,
            IMMUTABLE_REF,
            PLATFORM,
            RELEASE_COMMIT,
            RELEASE_REF_DIR,
          } = process.env;
          const refPattern =
            /^ghcr\.io\/instafy-dev\/instafy-runtime-agent@sha256:[0-9a-f]{64}$/;
          const tagPattern =
            /^ghcr\.io\/instafy-dev\/instafy-runtime-agent:(webdev-)?[0-9a-f]{40}-linux-amd64$/;
          if (
            !["base", "webdev"].includes(FLAVOR) ||
            ARCHITECTURE !== "amd64" ||
            PLATFORM !== `linux/${ARCHITECTURE}` ||
            !/^[0-9a-f]{40}$/.test(RELEASE_COMMIT) ||
            !refPattern.test(IMMUTABLE_REF) ||
            !tagPattern.test(ARCH_TAG)
          ) {
            throw new Error("Refusing to record an invalid architecture release record.");
          }
          const record = {
            schemaVersion: 1,
            coreCommit: RELEASE_COMMIT,
            flavor: FLAVOR,
            architecture: ARCHITECTURE,
            platform: PLATFORM,
            archTag: ARCH_TAG,
            immutableRef: IMMUTABLE_REF,
          };
          fs.writeFileSync(
            path.join(RELEASE_REF_DIR, `${FLAVOR}-${ARCHITECTURE}.json`),
            `${JSON.stringify(record, null, 2)}\n`,
            { flag: "wx", mode: 0o600 },
          );
          NODE
          {
            echo "### ${FLAVOR} ${ARCHITECTURE} runtime-agent"
            echo
            echo "- Architecture tag: \`${ARCH_TAG}\`"
            echo "- Immutable image: \`${immutable_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable architecture record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-agent-arch-ref-${{ matrix.flavor }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/runtime-agent-arch-ref/${{ matrix.flavor }}-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 7

      # Write the layer cache only after this cell's image passed the gates and
      # was pushed and recorded. This cache-only build repeats the audit build on
      # the same builder with the same context, file, target, platform, build
      # arguments and labels, so it resolves from this job's BuildKit state. It
      # creates no image, tag or local copy and cannot change published bytes.
      # A failed or slow export costs a later release a cold build, nothing more.
      # ignore-error makes BuildKit report a failed cache write only in the
      # progress log, so the step also warns when that log shows an error.
      - name: Export the scanned build's layer cache
        shell: bash
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_COMMIT: ${{ needs.authorize.outputs.commit_sha }}
          CACHE_REF: ghcr.io/instafy-dev/instafy-build-cache:publish-runtime-agent-${{ matrix.flavor }}-${{ matrix.architecture }}
        run: |
          set -euo pipefail
          status=0
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          timeout --kill-after=1m 15m docker buildx build \
            --builder "$BUILDER" \
            --progress=plain \
            --platform "$PLATFORM" \
            --file docker/runtime/Dockerfile \
            --target "$TARGET" \
            --build-arg BUILD_PROFILE=release \
            --build-arg BUILD_ARTIFACT_DIR=release \
            --label "org.opencontainers.image.source=https://github.com/instafy-dev/instafy" \
            --label "org.opencontainers.image.revision=${RELEASE_COMMIT}" \
            --label "org.opencontainers.image.version=${RELEASE_COMMIT}" \
            --provenance=false \
            --sbom=false \
            --output type=cacheonly \
            --cache-to "type=registry,ref=${CACHE_REF},mode=max,oci-mediatypes=true,image-manifest=true,ignore-error=true" \
            . 2>&1 | tee "$log" || status=$?
          if [[ "$status" != "0" ]]; then
            echo "::warning::The layer cache export stopped with status ${status}. The published image is unaffected; the next release may build cold."
          elif grep -Eq '^#[0-9]+ ERROR: ' "$log"; then
            echo "::warning::The layer cache export reported an error (see the ERROR lines above). The published image is unaffected; the next release may build cold."
          fi

  assemble-release-manifest:
    name: Assemble and seal the runtime release manifest
    needs:
      - authorize
      - build-scan-push
    runs-on: >-
      ${{ vars.TRUSTED_AMD64_BUILD_RUNNER_MODE == 'self-hosted'
          && github.repository == 'instafy-dev/instafy'
          && github.repository_id == '1309636737'
          && github.event.repository.private == true
          && github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && github.ref_protected == true
          && github.workflow_ref == 'instafy-dev/instafy/.github/workflows/publish-runtime-agent.yml@refs/heads/main'
          && github.workflow_sha == github.sha
          && inputs.commit_sha == github.sha
          && fromJSON('{"group":"org/instafy-trusted-build","labels":["self-hosted","Linux","X64","instafy-build"]}')
          || 'ubuntu-latest' }}
    # Only reads the registry: this job creates no tag or index.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.35.0

      - name: Download immutable architecture records
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: runtime-agent-arch-ref-*
          path: ${{ runner.temp }}/runtime-agent-arch-refs
          merge-multiple: true

      - name: Validate exactly one amd64 record per flavor
        env:
          EXPECTED_CORE_COMMIT: ${{ needs.authorize.outputs.commit_sha }}
          RELEASE_REF_DIR: ${{ runner.temp }}/runtime-agent-arch-refs
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const { EXPECTED_CORE_COMMIT, RELEASE_REF_DIR } = process.env;
          if (!/^[0-9a-f]{40}$/.test(EXPECTED_CORE_COMMIT)) {
            throw new Error("Expected core commit is invalid.");
          }
          const refPattern =
            /^ghcr\.io\/instafy-dev\/instafy-runtime-agent@sha256:[0-9a-f]{64}$/;
          const flavors = ["base", "webdev"];
          const expected = flavors.map((flavor) => `${flavor}-amd64.json`);
          const actual = fs.readdirSync(RELEASE_REF_DIR).sort();
          if (actual.join("\0") !== [...expected].sort().join("\0")) {
            throw new Error(
              `Expected exactly one amd64 record per flavor, found: ${actual.join(", ")}`,
            );
          }
          const refs = {};
          for (const flavor of flavors) {
            const filename = path.join(RELEASE_REF_DIR, `${flavor}-amd64.json`);
            const record = JSON.parse(fs.readFileSync(filename, "utf8"));
            const keys = Object.keys(record).sort();
            const expectedKeys = [
              "archTag",
              "architecture",
              "coreCommit",
              "flavor",
              "immutableRef",
              "platform",
              "schemaVersion",
            ];
            const tagPrefix = flavor === "webdev" ? "webdev-" : "";
            const expectedTag =
              "ghcr.io/instafy-dev/instafy-runtime-agent:" +
              `${tagPrefix}${EXPECTED_CORE_COMMIT}-linux-amd64`;
            if (
              keys.join("\0") !== expectedKeys.join("\0") ||
              record.schemaVersion !== 1 ||
              record.coreCommit !== EXPECTED_CORE_COMMIT ||
              record.flavor !== flavor ||
              record.architecture !== "amd64" ||
              record.platform !== "linux/amd64" ||
              record.archTag !== expectedTag ||
              !refPattern.test(record.immutableRef)
            ) {
              throw new Error(`Invalid ${flavor}/amd64 release record.`);
            }
            refs[flavor] = record.immutableRef;
          }
          if (refs.base === refs.webdev) {
            throw new Error("Base and webdev runtime images must have distinct digests.");
          }
          NODE

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release manifest names the scanned amd64 images themselves; no
      # index is created here. A docker push normally yields a single image
      # manifest, and a one-platform index is accepted too, so long as the only
      # platform it can resolve to is linux/amd64.
      - name: Verify each flavor resolves only to the scanned linux/amd64 image
        shell: bash
        env:
          EXPECTED_CORE_COMMIT: ${{ needs.authorize.outputs.commit_sha }}
          RELEASE_REF_DIR: ${{ runner.temp }}/runtime-agent-arch-refs
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/runtime-agent-release-manifest
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_MANIFEST_DIR"
          for flavor in base webdev; do
            immutable_image="$(jq -er '.immutableRef' "$RELEASE_REF_DIR/${flavor}-amd64.json")"
            arch_tag="$(jq -er '.archTag' "$RELEASE_REF_DIR/${flavor}-amd64.json")"
            raw_manifest="$RUNNER_TEMP/${flavor}-manifest.json"
            image_config="$RUNNER_TEMP/${flavor}-image-config.json"
            registry_visible=false
            for attempt in 1 2 3 4 5 6; do
              if docker buildx imagetools inspect "$immutable_image" --raw > "$raw_manifest" &&
                docker buildx imagetools inspect "$immutable_image" --format '{{json .Image}}' > "$image_config"; then
                registry_visible=true
                break
              fi
              if [[ "$attempt" != "6" ]]; then
                delay_seconds=$((1 << attempt))
                echo "::warning::GHCR has not exposed ${immutable_image} yet; retrying in ${delay_seconds}s."
                sleep "$delay_seconds"
              fi
            done
            if [[ "$registry_visible" != "true" ]]; then
              echo "::error::GHCR did not expose the ${flavor} release image within the bounded visibility window."
              exit 1
            fi
            if ! jq -e '
                if (.manifests | type) == "array" then
                  [.manifests[].platform |
                    select(.os != "unknown" and .architecture != "unknown") |
                    "\(.os)/\(.architecture)"
                  ] == ["linux/amd64"]
                else
                  .mediaType == "application/vnd.oci.image.manifest.v1+json" or
                  .mediaType == "application/vnd.docker.distribution.manifest.v2+json"
                end
              ' "$raw_manifest" >/dev/null; then
              echo "::error::The ${flavor} release image is not a single linux/amd64 image."
              exit 1
            fi
            if ! jq -e '
                if has("architecture") then
                  .os == "linux" and .architecture == "amd64"
                else
                  keys == ["linux/amd64"] and
                  .["linux/amd64"].os == "linux" and
                  .["linux/amd64"].architecture == "amd64"
                end
              ' "$image_config" >/dev/null; then
              echo "::error::The ${flavor} release image configuration is not linux/amd64."
              exit 1
            fi
            jq -n \
              --arg coreCommit "$EXPECTED_CORE_COMMIT" \
              --arg flavor "$flavor" \
              --arg immutableRef "$immutable_image" \
              '{
                schemaVersion: 1,
                coreCommit: $coreCommit,
                flavor: $flavor,
                immutableRef: $immutableRef
              }' > "$RELEASE_MANIFEST_DIR/${flavor}.json"
            {
              echo "### ${flavor} runtime-agent"
              echo
              echo "- Architecture tag: \`${arch_tag}\`"
              echo "- Immutable image: \`${immutable_image}\`"
              echo "- Platform: \`linux/amd64\` (multi-arch tags come from publish-runtime-agent-multiarch.yml)"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Aggregate exact release manifest
        env:
          EXPECTED_CORE_COMMIT: ${{ needs.authorize.outputs.commit_sha }}
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/runtime-agent-release-manifest
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const { EXPECTED_CORE_COMMIT, RELEASE_MANIFEST_DIR } = process.env;
          if (!/^[0-9a-f]{40}$/.test(EXPECTED_CORE_COMMIT)) {
            throw new Error("Expected core commit is invalid.");
          }
          const imagePattern =
            /^ghcr\.io\/instafy-dev\/instafy-runtime-agent@sha256:[0-9a-f]{64}$/;
          const images = {};
          for (const flavor of ["base", "webdev"]) {
            const filename = path.join(RELEASE_MANIFEST_DIR, `${flavor}.json`);
            const record = JSON.parse(fs.readFileSync(filename, "utf8"));
            const keys = Object.keys(record).sort();
            if (
              keys.join("\0") !==
                ["coreCommit", "flavor", "immutableRef", "schemaVersion"].join("\0") ||
              record.schemaVersion !== 1 ||
              record.coreCommit !== EXPECTED_CORE_COMMIT ||
              record.flavor !== flavor ||
              !imagePattern.test(record.immutableRef)
            ) {
              throw new Error(`Invalid ${flavor} runtime release record.`);
            }
            images[flavor] = record.immutableRef;
          }
          if (images.base === images.webdev) {
            throw new Error("Base and webdev runtime images must have distinct manifests.");
          }
          const manifest = {
            schemaVersion: 1,
            coreCommit: EXPECTED_CORE_COMMIT,
            images,
          };
          fs.writeFileSync(
            path.join(RELEASE_MANIFEST_DIR, "runtime-agent-release-manifest.json"),
            `${JSON.stringify(manifest, null, 2)}\n`,
            { flag: "wx", mode: 0o600 },
          );
          NODE

      - name: Upload immutable flavor references
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-agent-release-ref-base
          path: ${{ runner.temp }}/runtime-agent-release-manifest/base.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload immutable webdev flavor reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-agent-release-ref-webdev
          path: ${{ runner.temp }}/runtime-agent-release-manifest/webdev.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload runtime-agent release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-agent-release-manifest
          path: ${{ runner.temp }}/runtime-agent-release-manifest/runtime-agent-release-manifest.json
          if-no-files-found: error
          retention-days: 90
