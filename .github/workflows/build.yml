name: Public Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: public-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-verification:
    name: Browser verification
    uses: ./.github/workflows/browser-e2e.yml
    permissions:
      contents: read

  secret-scan:
    # Pull requests are leak-gated by the base-owned Trusted Public Boundary workflow.
    name: Secret scan
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: >-
      ${{ vars.CI_EXPANDED_SELF_HOSTED == 'true'
          && github.repository == 'instafy-dev/instafy'
          && github.event.repository.private == true
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && github.ref_protected == true
          && fromJSON(format('{{"group":"org/instafy-ci-main","labels":["self-hosted","Linux","ARM64","instafy-ci-bootstrap-{0}-{1}-{2}-public-secret-scan","instafy-ci-trust-main"]}}', github.repository_id, github.run_id, github.run_attempt))
          || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Qualify isolated expanded CI runner
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          assert.ok(Number.isSafeInteger(process.getuid()) && process.getuid() > 0);
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(process.env.RUNNER_OS, 'Linux');
          assert.equal(process.env.RUNNER_ARCH, 'ARM64');
          assert.equal(process.env.INSTAFY_CI_JOB_ISOLATION, 'ephemeral');
          assert.ok(!process.env.INSTAFY_ENV_DIR);
          for (const tool of ['bash', 'git', 'curl', 'tar', 'sha256sum', 'unzip', 'sudo', 'install']) {
            execFileSync('/bin/bash', ['-c', 'command -v "$1" >/dev/null', 'expanded-ci-preflight', tool], { timeout: 1000, stdio: 'ignore' });
          }
          NODE

      - name: Checkout repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_LINUX_ARM64_SHA256: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) asset=linux_x64; checksum="$GITLEAKS_LINUX_X64_SHA256" ;;
            aarch64) asset=linux_arm64; checksum="$GITLEAKS_LINUX_ARM64_SHA256" ;;
            *) echo "::error::Unsupported Linux scanner architecture."; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${asset}.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"

      - name: Test public boundary controls
        run: |
          node --test \
            scripts/check-public-boundary.test.mjs \
            scripts/check-public-boundary-workflow.test.mjs \
            scripts/check-expanded-ci-routing.test.mjs

      - name: Enforce public repository boundary
        run: node scripts/check-public-boundary.mjs

      - name: Create isolated Gitleaks ignore input
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/gitleaks-public-ci.empty-ignore"

      - name: Scan the complete current tree
        run: |
          set -euo pipefail
          gitleaks dir \
            --config "$GITHUB_WORKSPACE/scripts/public-boundary-gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-public-ci.empty-ignore" \
            --ignore-gitleaks-allow \
            --log-level=error \
            --max-archive-depth=1 \
            --max-decode-depth=3 \
            --max-target-megabytes=0 \
            --no-banner \
            --no-color \
            --redact=100 \
            --timeout=110 \
            .

      - name: Scan tracked bytes without path allowlists
        run: |
          set -euo pipefail
          tracked_inventory="$RUNNER_TEMP/public-boundary-main-files.zlist"
          git ls-files --cached -z > "$tracked_inventory"
          test -s "$tracked_inventory"
          while IFS= read -r -d '' relative_path; do
            if [[ -f "$relative_path" && ! -L "$relative_path" ]]; then
              cat -- "$relative_path"
              printf '\n'
            fi
          done < "$tracked_inventory" |
            gitleaks stdin \
              --config "$GITHUB_WORKSPACE/scripts/public-boundary-gitleaks-stream.toml" \
              --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-public-ci.empty-ignore" \
              --ignore-gitleaks-allow \
              --log-level=error \
              --max-archive-depth=1 \
              --max-decode-depth=3 \
              --max-target-megabytes=0 \
              --no-banner \
              --no-color \
              --redact=100 \
              --timeout=110

      - name: Scan introduced commits
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [[ -n "${PUSH_BEFORE_SHA:-}" && "$PUSH_BEFORE_SHA" != "$zero_sha" ]]; then
            log_range="${PUSH_BEFORE_SHA}..HEAD"
          elif parent_sha="$(git rev-parse HEAD^ 2>/dev/null)"; then
            log_range="${parent_sha}..HEAD"
          else
            echo "Reviewed parentless seed is covered by the public export gate."
            exit 0
          fi
          gitleaks git \
            --config "$GITHUB_WORKSPACE/scripts/public-boundary-gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-public-ci.empty-ignore" \
            --ignore-gitleaks-allow \
            --log-level=error \
            --max-archive-depth=1 \
            --max-decode-depth=3 \
            --max-target-megabytes=0 \
            --no-banner \
            --no-color \
            --redact=100 \
            --log-opts="$log_range" \
            --timeout=110 \
            .

  javascript:
    name: JavaScript packages
    needs:
      - javascript-contracts
      - javascript-frontend
      - javascript-cli
      - javascript-desktop
    if: ${{ always() }}
    runs-on: >-
      ${{ vars.CI_JAVASCRIPT_SELF_HOSTED == 'true'
          && github.repository == 'instafy-dev/instafy'
          && github.event.repository.private == true
          && ((github.event_name == 'pull_request'
               && github.event.pull_request.base.ref == 'main'
               && github.event.pull_request.base.repo.full_name == github.repository
               && github.event.pull_request.head.repo.full_name == github.repository
               && github.event.pull_request.head.repo.fork == false)
              || (github.event_name == 'push'
                  && github.ref == 'refs/heads/main'
                  && github.ref_protected == true))
          && fromJSON(format('{{"group":"org/instafy-ci-{0}","labels":["self-hosted","Linux","ARM64","instafy-ci-bootstrap-{1}-{2}-{3}-public-js-aggregate","instafy-ci-trust-{0}"]}}', github.event_name == 'pull_request' && 'pr' || 'main', github.repository_id, github.run_id, github.run_attempt))
          || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Qualify isolated JavaScript CI runner
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          assert.ok(Number.isSafeInteger(process.getuid()) && process.getuid() > 0);
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(process.env.RUNNER_OS, 'Linux');
          assert.equal(process.env.RUNNER_ARCH, 'ARM64');
          assert.equal(process.env.INSTAFY_CI_JOB_ISOLATION, 'ephemeral');
          assert.ok(!process.env.INSTAFY_ENV_DIR);
          for (const tool of ['bash', 'git', 'curl', 'tar', 'sha256sum', 'unzip']) {
            execFileSync('/bin/bash', ['-c', 'command -v "$1" >/dev/null', 'javascript-ci-preflight', tool], { timeout: 1000, stdio: 'ignore' });
          }
          NODE

      - name: Require every JavaScript lane to succeed
        env:
          JAVASCRIPT_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const expected = ['javascript-contracts', 'javascript-frontend', 'javascript-cli', 'javascript-desktop'];
          const results = JSON.parse(process.env.JAVASCRIPT_RESULTS);
          assert.deepEqual(Object.keys(results).sort(), expected.sort());
          for (const name of expected) {
            assert.equal(results[name].result, 'success', 'Every JavaScript lane must succeed: ' + name);
          }
          console.log('All JavaScript contracts, migrations, frontend, CLI and Desktop checks passed.');
          NODE

  javascript-contracts:
    name: JavaScript contracts and migrations
    runs-on: >-
      ${{ vars.CI_JAVASCRIPT_SELF_HOSTED == 'true'
          && github.repository == 'instafy-dev/instafy'
          && github.event.repository.private == true
          && ((github.event_name == 'pull_request'
               && github.event.pull_request.base.ref == 'main'
               && github.event.pull_request.base.repo.full_name == github.repository
               && github.event.pull_request.head.repo.full_name == github.repository
               && github.event.pull_request.head.repo.fork == false)
              || (github.event_name == 'push'
                  && github.ref == 'refs/heads/main'
                  && github.ref_protected == true))
          && fromJSON(format('{{"group":"org/instafy-ci-{0}","labels":["self-hosted","Linux","ARM64","instafy-ci-bootstrap-{1}-{2}-{3}-public-js-contracts","instafy-ci-trust-{0}"]}}', github.event_name == 'pull_request' && 'pr' || 'main', github.repository_id, github.run_id, github.run_attempt))
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Qualify isolated JavaScript CI runner
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          assert.ok(Number.isSafeInteger(process.getuid()) && process.getuid() > 0);
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(process.env.RUNNER_OS, 'Linux');
          assert.equal(process.env.RUNNER_ARCH, 'ARM64');
          assert.equal(process.env.INSTAFY_CI_JOB_ISOLATION, 'ephemeral');
          assert.ok(!process.env.INSTAFY_ENV_DIR);
          for (const tool of ['bash', 'git', 'curl', 'tar', 'sha256sum', 'unzip', 'docker']) {
            execFileSync('/bin/bash', ['-c', 'command -v "$1" >/dev/null', 'javascript-ci-preflight', tool], { timeout: 1000, stdio: 'ignore' });
          }
          const engine = JSON.parse(execFileSync('docker', ['info', '--format', '{{json .}}'], { timeout: 5000, encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }));
          assert.equal(engine.OSType, 'linux');
          assert.ok(['aarch64', 'arm64'].includes(engine.Architecture));
          NODE

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify JavaScript CI coverage and routing
        run: node --test scripts/check-javascript-ci.test.mjs

      - name: Validate public migration ordering
        run: node scripts/check-supabase-migrations.mjs

      - name: Test public migration and self-host contracts
        run: |
          node --test \
            scripts/check-public-boundary-workflow.test.mjs \
            scripts/check-production-image-inputs.test.mjs \
            scripts/check-production-services-workflow.test.mjs \
            scripts/check-public-release-workflows.test.mjs \
            scripts/check-changesets.test.mjs \
            scripts/verify-changeset-pack.test.mjs \
            scripts/lib/codexMachineAuthExpiry.test.mjs \
            scripts/check-supabase-migrations.test.mjs \
            scripts/test-supabase-migrations-empty-db.test.mjs \
            scripts/ensure-supabase-postgres-image.test.mjs \
            scripts/check-self-host-compose.test.mjs
          node scripts/check-self-host-compose.mjs

      # public.ecr.aws rate-limits anonymous pulls per source IP and hosted
      # runners share IP pools, so the migration test's implicit pull failed
      # intermittently. The tarball is keyed on the file that carries the
      # digest pin: bumping the digest invalidates the cache instead of
      # loading the old image.
      - name: Restore Supabase Postgres image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.instafy-image-cache
          key: supabase-postgres-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test-supabase-migrations-empty-db.mjs') }}

      - name: Ensure Supabase Postgres image
        run: node scripts/ensure-supabase-postgres-image.mjs

      - name: Apply public migrations to an empty database
        run: node scripts/test-supabase-migrations-empty-db.mjs

