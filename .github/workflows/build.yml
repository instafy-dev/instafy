name: Public Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: public-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-verification:
    name: Browser verification
    uses: ./.github/workflows/browser-e2e.yml
    permissions:
      contents: read

  secret-scan:
    # Pull requests are leak-gated by the base-owned Trusted Public Boundary workflow.
    name: Secret scan
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"

      - name: Test public boundary controls
        run: |
          node --test \
            scripts/check-public-boundary.test.mjs \
            scripts/check-public-boundary-workflow.test.mjs

      - name: Enforce public repository boundary
        run: node scripts/check-public-boundary.mjs

      - name: Create isolated Gitleaks ignore input
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/gitleaks-public-ci.empty-ignore"

      - name: Scan the complete current tree
        run: |
          set -euo pipefail
          gitleaks dir \
            --config "$GITHUB_WORKSPACE/scripts/public-boundary-gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-public-ci.empty-ignore" \
            --ignore-gitleaks-allow \
            --log-level=error \
            --max-archive-depth=1 \
            --max-decode-depth=3 \
            --max-target-megabytes=0 \
            --no-banner \
            --no-color \
            --redact=100 \
            --timeout=110 \
            .

      - name: Scan tracked bytes without path allowlists
        run: |
          set -euo pipefail
          tracked_inventory="$RUNNER_TEMP/public-boundary-main-files.zlist"
          git ls-files --cached -z > "$tracked_inventory"
          test -s "$tracked_inventory"
          while IFS= read -r -d '' relative_path; do
            if [[ -f "$relative_path" && ! -L "$relative_path" ]]; then
              cat -- "$relative_path"
              printf '\n'
            fi
          done < "$tracked_inventory" |
            gitleaks stdin \
              --config "$GITHUB_WORKSPACE/scripts/public-boundary-gitleaks-stream.toml" \
              --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-public-ci.empty-ignore" \
              --ignore-gitleaks-allow \
              --log-level=error \
              --max-archive-depth=1 \
              --max-decode-depth=3 \
              --max-target-megabytes=0 \
              --no-banner \
              --no-color \
              --redact=100 \
              --timeout=110

      - name: Scan introduced commits
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [[ -n "${PUSH_BEFORE_SHA:-}" && "$PUSH_BEFORE_SHA" != "$zero_sha" ]]; then
            log_range="${PUSH_BEFORE_SHA}..HEAD"
          elif parent_sha="$(git rev-parse HEAD^ 2>/dev/null)"; then
            log_range="${parent_sha}..HEAD"
          else
            echo "Reviewed parentless seed is covered by the public export gate."
            exit 0
          fi
          gitleaks git \
            --config "$GITHUB_WORKSPACE/scripts/public-boundary-gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-public-ci.empty-ignore" \
            --ignore-gitleaks-allow \
            --log-level=error \
            --max-archive-depth=1 \
            --max-decode-depth=3 \
            --max-target-megabytes=0 \
            --no-banner \
            --no-color \
            --redact=100 \
            --log-opts="$log_range" \
            --timeout=110 \
            .

  javascript:
    name: JavaScript packages
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate public migration ordering
        run: node scripts/check-supabase-migrations.mjs

      - name: Test public migration and self-host contracts
        run: |
          node --test \
            scripts/check-public-boundary-workflow.test.mjs \
            scripts/check-production-image-inputs.test.mjs \
            scripts/check-production-services-workflow.test.mjs \
            scripts/controller-image-smoke.test.mjs \
            scripts/check-public-release-workflows.test.mjs \
            scripts/check-changesets.test.mjs \
            scripts/verify-changeset-pack.test.mjs \
            scripts/lib/codexMachineAuthExpiry.test.mjs \
            scripts/check-supabase-migrations.test.mjs \
            scripts/test-supabase-migrations-empty-db.test.mjs \
            scripts/ensure-supabase-postgres-image.test.mjs \
            scripts/check-self-host-compose.test.mjs
          node scripts/check-self-host-compose.mjs

      # public.ecr.aws rate-limits anonymous pulls per source IP and hosted
      # runners share IP pools, so the migration test's implicit pull failed
      # intermittently. The tarball is keyed on the file that carries the
      # digest pin: bumping the digest invalidates the cache instead of
      # loading the old image.
      - name: Restore Supabase Postgres image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.instafy-image-cache
          key: supabase-postgres-image-${{ hashFiles('scripts/test-supabase-migrations-empty-db.mjs') }}

      - name: Ensure Supabase Postgres image
        run: node scripts/ensure-supabase-postgres-image.mjs

      - name: Apply public migrations to an empty database
        run: node scripts/test-supabase-migrations-empty-db.mjs

      - name: Lint frontend
        run: pnpm --filter @instafy/frontend lint

      - name: Build frontend
        run: pnpm --filter @instafy/frontend build

      - name: Test frontend
        run: pnpm --filter @instafy/frontend test:unit

      - name: Test CLI package artifact
        run: pnpm --filter @instafy/cli test:package

      - name: Validate provider contract package artifact
        working-directory: packages/provider-contract
        run: npm pack --dry-run --ignore-scripts

      - name: Test CLI automations
        run: pnpm --filter @instafy/cli exec vitest run test/automations.e2e.spec.ts

      - name: Build and test desktop runtime
        run: |
          pnpm --filter @instafy/desktop-runtime-agent build
          pnpm --filter @instafy/desktop-runtime-agent exec vitest run

      - name: Build and test desktop app
        run: pnpm --filter @instafy/desktop-app test

  go:
    name: Go packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Test browser egress proxy
        working-directory: packages/browser-egress-proxy
        run: go test ./...

      - name: Test browser WebRTC sender
        working-directory: packages/browser-webrtc-sender
        run: go test ./...

      - name: Test controller image startup fixture
        working-directory: scripts/controller-startup-smoke
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
        run: |
          go test -race -count=1 ./...
          go vet ./...

  rust:
    name: Rust packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check public Rust packages
        run: |
          cargo check --locked --tests --manifest-path packages/runtime-controller/Cargo.toml
          cargo check --locked --tests --manifest-path packages/runtime-agent/Cargo.toml
          cargo check --locked --tests --manifest-path packages/git-service/Cargo.toml
          cargo check --locked --tests --manifest-path packages/runtime-provider-service/Cargo.toml
          cargo check --locked --tests --manifest-path packages/tunnel-broker/Cargo.toml

  # Formatting ran nowhere in CI, so main drifted out of `cargo fmt` shape and
  # every branch cut from it inherited the failure — reviewers then charged the
  # violations to whichever PR happened to be measured. rustfmt only parses, so
  # this reports in about a minute rather than after the 45-minute test job.
  rust-fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt

      # Crates are discovered, not listed: a new crate cannot silently escape
      # the gate the way it can with a hand-maintained list. `--all` is
      # required because packages/tunnel-broker is a virtual workspace manifest
      # with no targets of its own — without it that crate errors instead of
      # being checked. Every manifest is checked before failing, so one run
      # names every offending file.
      - name: Check formatting
        run: |
          fmt_status=0
          for manifest in packages/*/Cargo.toml; do
            echo "== $manifest"
            cargo fmt --all --manifest-path "$manifest" --check || fmt_status=1
          done
          exit $fmt_status

  # The `rust` job above only type-checks, and the Controller DB Tests
  # workflow covers only the runtime-controller suite. This job executes the
  # remaining Rust test suites — contracts, runtime-agent, openai-proxy,
  # origin-http-server, git-service — which otherwise run nowhere in CI
  # (issue #142's other half). None of them need a database.
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      # One target dir for all five suites: the crates share most of their
      # dependency graph, and per-package target dirs overflowed the runner
      # disk when this job also compiled the controller.
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "pnpm"

      # The shared-browser tests spawn node against a pinned playwright
      # fixture from the workspace's node_modules.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Hosted runners keep ~14GB free on /; five crates of test builds plus
      # the restored cache need headroom. Drop toolchains this job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Test builds are much heavier than the check job's; cache the registry
      # and the shared target dir keyed on the lockfiles so warm runs skip
      # most of the compile. v2 namespace: the v1 cache carried the full
      # controller build and ENOSPC'd the runner during restore.
      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          key: rust-tests-v2-${{ runner.os }}-${{ hashFiles('packages/*/Cargo.lock') }}
          restore-keys: |
            rust-tests-v2-${{ runner.os }}-

      - name: Run database-free Rust test suites
        run: |
          cargo test --manifest-path packages/runtime-contracts/Cargo.toml
          cargo test --manifest-path packages/runtime-agent/Cargo.toml --no-run
          cargo test --manifest-path packages/runtime-agent/Cargo.toml --lib --test controller_client -- --test-threads=1
          cargo test --manifest-path packages/openai-proxy-server/Cargo.toml
          cargo test --manifest-path packages/origin-http-server/Cargo.toml
          cargo test --manifest-path packages/git-service/Cargo.toml
