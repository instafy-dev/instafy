<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200" />
    <title>Instafy social card</title>
    <!--
      The template scripts/generate-og-image.mjs renders into
      packages/frontend/public/og-image.png (docs/Brand.md, Social card). It is
      the landing hero, cropped: marketing paper and its dot grid, the header
      lockup, the headline and sub copy, and the studio window with Cub on its
      corner. Fonts and the script are served by the generator from the repo and
      node_modules; nothing is fetched from the network.
    -->
    <style>
      @font-face { font-family: "Inter"; font-weight: 400; src: url("fonts/inter-400.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "Inter"; font-weight: 500; src: url("fonts/inter-500.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("fonts/inter-600.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "Inter"; font-weight: 700; src: url("fonts/inter-700.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("fonts/inter-800.woff2") format("woff2"); font-display: block; }

      :root {
        /* --marketing-canvas and --marketing-grid (tailwind.css), brand ink, slate. */
        --paper: #f8f8f6;
        --grid: #dcdad2;
        --ink: #0f172a;
        --slate-700: #334155;
        --slate-600: #475569;
        --slate-500: #64748b;
        --divider: #eef1f5;
        /* A warm hairline one step past the grid dots: the card's edge on white feeds. */
        --edge: #dedbd2;
        --coin-shadow: 0 0 0 1px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.12),
          0 2px 6px -1px rgba(15, 23, 42, 0.1);
        /* card.js sets these from its LAYOUT (the committed card's values). */
        --gx: 64px;
        --grid-top: 148px;
        --copy-top: 148px;
        --ledge: 568px;
        --win-w: 1024px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
      body { font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

      #card { position: relative; width: 1200px; height: 630px; overflow: hidden; isolation: isolate; background: var(--paper); }
      /* The landing's .marketing-dot-grid, unchanged. As on the landing it fills
         the hero only: the header band above it is flat paper, the flat surface
         the crew mark needs (docs/Brand.md). */
      #grid {
        position: absolute; left: 0; right: 0; bottom: 0; top: var(--grid-top); z-index: 0;
        background-image: radial-gradient(circle, var(--grid) 1.2px, transparent 1.6px);
        background-size: 24px 24px; background-position: 0 0;
      }
      #edge { position: absolute; inset: 0; z-index: 6; border: 2px solid var(--edge); pointer-events: none; }

      /* The header lockup: mark and bold wordmark, scaled up for a 300-500 px unfurl. */
      #lockup { position: absolute; top: 34px; z-index: 2; display: flex; align-items: center; gap: 20px; }
      #lockup svg { width: 80px; height: 80px; color: var(--ink); display: block; }
      #wordmark { font-size: 50px; font-weight: 700; letter-spacing: -0.025em; line-height: 1; }
      #domain { position: absolute; right: var(--gx); z-index: 2; font-size: 27px; font-weight: 500; letter-spacing: -0.01em; color: var(--slate-600); line-height: 1; }

      /* Headline and sub copy: LandingHero.tsx (extrabold, leading 0.98,
         tracking -0.045em; the sub in slate, one step darker for thumbnails). */
      #copy { position: absolute; left: var(--gx); top: var(--copy-top); z-index: 2; }
      h1 { font-size: 98px; font-weight: 800; line-height: 0.98; letter-spacing: -0.045em; color: var(--ink); white-space: nowrap; }
      h1 span { display: block; }
      #sub { margin-top: 20px; font-size: 31px; line-height: 1.34; letter-spacing: -0.012em; color: var(--slate-700); font-weight: 400; white-space: nowrap; }

      /* The studio window (landingStudioChrome.ts FRAME + WORKSPACE), cut to its
         top bar: the ledge Cub sits on and his ink lands on, the conversation's
         title and the roster, one slab running off the card's bottom edge. The
         committed card (bar=0) hides the bar and keeps its height: the ledge alone. */
      #win {
        position: absolute; left: var(--gx); top: var(--ledge); width: var(--win-w); height: 240px; z-index: 1;
        border-radius: 22px; border: 1px solid rgba(226, 232, 240, 0.7); background: #ffffff; overflow: hidden;
        box-shadow: 0 1px 0 rgba(15, 23, 42, 0.03), 0 2px 6px -2px rgba(15, 23, 42, 0.06), 0 36px 80px -40px rgba(15, 23, 42, 0.3);
      }
      #topbar { position: relative; height: 80px; display: flex; align-items: center; padding: 0 28px; border-bottom: 1px solid var(--divider); }
      #tab { display: flex; align-items: center; gap: 12px; font-size: 27px; font-weight: 600; color: var(--ink); letter-spacing: -0.015em; }
      #tab svg { width: 30px; height: 30px; color: var(--slate-500); flex: none; }
      #roster { position: absolute; top: 15px; display: flex; gap: 11px; z-index: 4; }
      .coin { width: 48px; height: 48px; border-radius: 999px; display: grid; place-items: center; font-size: 20px; font-weight: 600; box-shadow: var(--coin-shadow); }
      /* One rule for faces (docs/Brand.md): people are circles and every AI,
         Octo included, is the AI tile (AI_TILE_SHAPE_CLASS and
         AI_TILE_EDGE_CLASS in OctoCoin.tsx): 30% corners and a 1px hairline
         of 14% ink just inside the edge. */
      .coin.agent, .coin.octo { border-radius: 30%; outline: 1px solid rgba(15, 23, 42, 0.14); outline-offset: -1px; }
      .coin.octo { background: #ffffff; color: var(--ink); }
      .coin.octo svg { width: 76%; height: 76%; display: block; }
      /* bar=0: the window is a plain slab, the ledge alone. */
      #card[data-bar="0"] #topbar { visibility: hidden; }

      #cub { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="grid"></div>
      <div id="lockup"><svg id="lockup-mark" viewBox="0 0 64 64" aria-hidden="true"></svg><span id="wordmark">Instafy</span></div>
      <span id="domain">instafy.dev</span>
      <div id="copy">
        <h1 id="h1"><span>Good work</span><span>has company.</span></h1>
        <p id="sub">Bring your people, your AI, and your work<br />into one place.</p>
      </div>
      <div id="win">
        <div id="topbar">
          <div id="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 18.5 4 20l1.2-3.6A8 8 0 1 1 7.5 18.5Z" /></svg>
            <span id="title">February close</span>
          </div>
          <div id="roster">
            <div class="coin" data-crew="0">A</div>
            <div class="coin" data-crew="1">K</div>
            <div class="coin octo"><svg id="coin-mark" viewBox="0 0 64 64" aria-hidden="true"></svg></div>
            <div class="coin agent" data-crew="2">Q</div>
          </div>
        </div>
      </div>
      <div id="cub"></div>
      <div id="edge"></div>
    </div>
    <script src="card.js"></script>
  </body>
</html>
